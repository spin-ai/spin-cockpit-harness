<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>需求管理 · 原型</title>
<!--
  需求管理（按项目 / RR–IR–SR–US / 可裁剪）静态交互原型
  对应方案：docs/product/REQ-requirements.md
  说明：单文件、双击打开、无构建；所有数据在内存，刷新即还原。不是实现。
  亮暗：右上按钮或 ?theme=dark；宽度按 1280 / 1440 设计，<1100 左栏收窄。
-->
<style>
:root{
  --font-sans:"Geist Variable","Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"Geist Mono Variable","Geist Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow-1:0 1px 2px rgba(10,10,10,.045);
  --shadow-float:0 18px 46px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10);
}
:root[data-theme="light"]{
  --page-canvas:#fafafa;--surface:#ffffff;--surface-hover:#f5f5f5;--surface-selected:#ededed;
  --border:#e5e5e5;--border-strong:#d4d4d4;--input:#e5e5e5;
  --fg:#0a0a0a;--fg-2:#404040;--muted:#696969;--faint:#a3a3a3;
  --brand:#171717;--brand-fg:#ffffff;--brand-soft:#f2f2f2;--brand-line:#dedede;
  --green:#3f9a68;--green-soft:#edf8f2;--green-line:#d5eedf;
  --amber:#a97a2f;--amber-soft:#fdf8ee;--amber-line:#f2e3c4;
  --red:#cf5f5d;--red-soft:#fdf2f2;--red-line:#f4d7d7;
  --purple:#7d67d1;--purple-soft:#f4f2fd;--purple-line:#e3ddf8;
}
:root[data-theme="dark"]{
  --page-canvas:#0a0a0a;--surface:#171717;--surface-hover:#262626;--surface-selected:#2e2e2e;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--input:rgba(255,255,255,.16);
  --fg:#f0f0f0;--fg-2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;
  --brand:#e5e5e5;--brand-fg:#0a0a0a;--brand-soft:#262626;--brand-line:#3a3a3a;
  --green:#5fb884;--green-soft:rgba(95,184,132,.12);--green-line:rgba(95,184,132,.28);
  --amber:#c9a25c;--amber-soft:rgba(201,162,92,.12);--amber-line:rgba(201,162,92,.26);
  --red:#d97a78;--red-soft:rgba(217,122,120,.12);--red-line:rgba(217,122,120,.26);
  --purple:#9c8ae0;--purple-soft:rgba(156,138,224,.12);--purple-line:rgba(156,138,224,.26);
  --shadow-1:0 1px 2px rgba(0,0,0,.22);
  --shadow-float:0 18px 46px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page-canvas);color:var(--fg);font:13px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:color-mix(in srgb,var(--fg) 14%,transparent);color:inherit}
svg{display:block}
.app{height:100vh;display:grid;grid-template-columns:56px minmax(0,1fr);min-width:0}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden;height:100vh}
.rail{height:100vh;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;background:var(--surface);border-right:1px solid var(--border)}
.rail-btn{width:48px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:9px;line-height:1}
.rail-btn:hover{background:var(--surface-hover);color:var(--fg)}
.rail-btn.on{background:var(--surface-selected);color:var(--fg)}
.rail-btn svg{width:18px;height:18px;display:block}
.rail-sep{width:24px;height:1px;background:var(--border);margin:5px 0}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px}

/* Page header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:end;padding:16px 24px 0}
.head h1{margin:0;font-size:22px;line-height:1.15;font-weight:600;letter-spacing:-.03em}
.head .sub{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.overview{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 24px 11px;font-size:11.5px;color:var(--muted)}
.overview b{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--fg)}
.overview .sep{color:var(--faint)}
.overview .warn b{color:var(--amber)}
.overview .run b{color:var(--brand)}

/* Controls */
.select,.input{height:28px;min-width:0;padding:0 8px;border:1px solid var(--input);border-radius:6px;background:var(--surface);color:var(--fg);font-size:11.5px;outline:none}
.select:focus,.input:focus{border-color:var(--border-strong)}
.btn{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-hover)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.primary:hover{opacity:.9}
.btn.tiny{height:26px;padding:0 8px;font-size:11.5px}
.icon-btn{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-hover);color:var(--fg)}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:14px;height:14px}
[data-theme="light"] .moon,[data-theme="dark"] .sun{display:none}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:26px;z-index:40;width:188px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-float)}
.menu button{width:100%;height:28px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-2);text-align:left}
.menu button:hover{background:var(--surface-hover);color:var(--fg)}
.menu .sep{height:1px;margin:4px 0;background:var(--border)}
.menu .menu-note{font-size:10px;color:var(--faint);padding:2px 8px 4px}

/* Tabs */
.tabs{display:inline-flex;align-self:flex-start;gap:2px;height:28px;padding:2px;margin:0 24px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.tab{height:22px;padding:0 11px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--surface-selected);color:var(--fg);box-shadow:var(--shadow-1)}
.tab .phase{font-family:var(--mono);font-size:9px;color:var(--faint)}

/* Workbench */
.workbench{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr);gap:12px;padding:0 24px 16px}
.workbench.single{grid-template-columns:minmax(0,1fr)}
.workbench.with-chat{grid-template-columns:232px minmax(0,1fr) 360px}
.workbench.single.with-chat{grid-template-columns:minmax(0,1fr) 360px}
.panel{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tree-panel{min-width:0}
.tree-tools{padding:9px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--border);flex:none}
.filter-row{display:flex;gap:5px}
.filter-row .select{flex:1;min-width:0}
.tree-scroll{flex:1;overflow:auto;padding:5px}
.tree-row{display:flex;align-items:center;gap:5px;height:30px;padding:0 5px;border-radius:6px;min-width:0;cursor:default}
.tree-row:hover{background:var(--surface-hover)}
.tree-row.on{background:var(--surface-selected)}
.tree-row .chev{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.tree-row .chev:hover{background:var(--border);color:var(--fg)}
.tree-row .chev svg{width:11px;height:11px;transition:transform .12s}
.tree-row .chev.open svg{transform:rotate(180deg)}
.chev-space{width:16px;flex:none}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
.dot.reviewing{background:var(--amber)}
.dot.approved{background:var(--fg-2)}
.dot.in_progress{background:var(--brand)}
.dot.verifying{background:var(--amber)}
.dot.done{background:var(--green)}
.dot.rejected,.dot.obsolete{background:var(--red)}
.key{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
.ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.tree-row .path{font-size:9.5px;color:var(--faint);margin-left:2px;flex:none;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.chip{height:17px;padding:0 5px;border:1px solid var(--border);border-radius:5px;display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);white-space:nowrap;line-height:1}
.chip.gap{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.chip.waiver{color:var(--faint)}
.chip.ai{color:var(--purple);border-color:var(--purple-line);background:var(--purple-soft)}
.chip.done{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.avatar{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:#fff;flex:none;letter-spacing:-.02em}
.avatar.big{width:22px;height:22px;font-size:10px}
.avatar.a{background:#6b7fd7}.avatar.b{background:#c47a57}.avatar.c{background:#5f9e78}.avatar.d{background:#8b7bb8}
.avatar-stack{display:inline-flex;align-items:center}
.avatar-stack .avatar{margin-left:-4px;border:1px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}
.avatar-stack .more{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:2px}


/* 需求会话（复用 Chat 的语法：气泡 / 提案卡 / composer） */
.chat-panel{min-width:0}
.chat-head{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--border);flex:none}
.ai-avatar{width:22px;height:22px;border-radius:50%;background:var(--purple-soft);border:1px solid var(--purple-line);color:var(--purple);display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;flex:none}
.chat-title{min-width:0;flex:1}
.chat-title .t{font-size:12px;font-weight:600}
.chat-title .sub{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chat-ctx{display:flex;gap:8px;flex-wrap:wrap;padding:6px 11px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--faint);flex:none}
.chat-body{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;background:var(--surface)}
.msg{display:flex;align-items:flex-start;gap:6px;min-width:0}
.msg.user{justify-content:flex-end}
.msg-col{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.bubble{max-width:88%;padding:7px 9px;border-radius:10px;background:var(--surface-hover);font-size:11.5px;line-height:1.6;white-space:pre-wrap;color:var(--fg-2);width:fit-content}
.msg.user .bubble{background:var(--brand);color:var(--brand-fg);margin-left:auto}
.proposal{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px;margin-top:5px;width:100%}
.proposal.applied{font-size:10.5px;color:var(--faint);padding:6px 8px;margin-top:5px;width:100%}
.proposal-head{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--fg);margin-bottom:3px}
.prop-row{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:11px;line-height:1.55;color:var(--fg-2);cursor:pointer}
.prop-row input{margin:2px 0 0;accent-color:var(--purple)}
.proposal-grant{margin-top:6px;padding-top:5px;border-top:1px dashed var(--border)}
.help-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:11px;color:var(--fg-2);border-bottom:1px solid var(--border)}
.help-row:last-of-type{border-bottom:0}
.result-row{display:flex;align-items:center;gap:6px;width:100%;padding:5px 0;border-bottom:1px solid var(--border);text-align:left;font-size:11px;color:var(--fg-2)}
.result-row:last-of-type{border-bottom:0}
.result-row:hover{color:var(--fg);background:var(--surface-hover)}
.result-row .prop-meta{margin-left:auto;flex:none}
.proposal-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.finding{display:flex;gap:5px;font-size:10.5px;line-height:1.55;padding:2px 0;color:var(--muted)}
.finding b{font-weight:600;flex:none}
.finding.blocker b{color:var(--red)}
.finding.warn b{color:var(--amber)}
.finding.ok b{color:var(--green)}
.chat-quick{display:flex;gap:4px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--border);flex:none}
.chat-quick button{height:22px;padding:0 7px;border:1px solid var(--border);border-radius:5px;font-size:10px;color:var(--muted)}
.chat-quick button:hover{background:var(--surface-hover);color:var(--fg)}
.chat-composer{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);flex:none}
.chat-composer .input{flex:1;height:28px}
.chat-input{height:auto;min-height:28px;max-height:88px;resize:none;padding:5px 8px;line-height:1.45;font-family:inherit}
.chat-composer .btn{height:28px;align-self:flex-end}
.typing-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint);padding:2px 0 0 28px}
.typing-dots{font-family:var(--mono);letter-spacing:1px;color:var(--purple)}
.bubble.streaming:after{content:"";display:inline-block;width:2px;height:11px;background:var(--fg-2);margin-left:2px;vertical-align:-1px;animation:blink 1s steps(2) infinite}
.msg-actions{display:flex;gap:6px;margin-top:3px;opacity:0;transition:opacity .12s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{font-size:9.5px;color:var(--faint)}
.msg-actions button:hover{color:var(--fg)}
@keyframes blink{50%{opacity:0}}

/* Empty states */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:46px 18px;text-align:center;color:var(--muted);font-size:11.5px}
.empty h3{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
.inline-empty{padding:6px 2px;font-size:11.5px;color:var(--faint)}

/* Detail */
.detail-panel{min-width:0}
.detail-scroll{flex:1;overflow:auto;padding:15px 18px 28px}
.crumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--faint)}
.crumbs button{font-family:var(--mono);font-size:10px;color:var(--muted)}
.crumbs button:hover{color:var(--fg);text-decoration:underline}
.crumbs b{font-weight:600;color:var(--fg-2)}
.detail-title{margin-top:7px}
.detail-key{font-family:var(--mono);font-size:11px;color:var(--faint)}
.title-row{display:flex;align-items:flex-start;gap:8px}
.title-row h2{flex:1;min-width:0;margin:2px 0 0;font-size:17px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.chat-entry{margin-top:1px;color:var(--muted);flex:none}
.chat-entry.on{background:var(--surface-selected);color:var(--fg)}
.link{font-size:inherit;color:var(--fg);text-decoration:underline;margin-left:4px}
.link:hover{color:var(--brand)}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted)}
.meta .select{height:24px}
.meta .prio{font-family:var(--mono);font-size:10.5px;color:var(--fg-2)}
.impl{display:flex;align-items:center;gap:7px;margin-top:10px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);font-size:11.5px;min-height:34px;flex-wrap:wrap}
.impl .label{font-size:10px;letter-spacing:.05em;color:var(--faint);font-family:var(--mono)}
.impl .sep{color:var(--faint)}
.msg-name{font-size:9.5px;color:var(--faint);margin-bottom:2px}
.path{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:0 0 5px;font-size:9.5px;color:var(--faint)}
.path button{height:19px;padding:0 5px;border:1px solid var(--border);border-radius:4px;font-size:9px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.path button:hover{background:var(--surface-hover);color:var(--fg)}
.path button b{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
.path > span{color:var(--faint)}
.flash{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px;transition:outline-color .2s}
.prop-meta{font-size:9.5px;color:var(--faint);font-family:var(--mono);line-height:1.5}
.prop-row b{font-weight:600;color:var(--fg-2)}
.prop-main{min-width:0;flex:1}
.mini-check{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);margin-top:2px}
.mini-check input{accent-color:var(--purple);margin:0}
.impl .who{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2)}
.impl .count{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.impl .spacer{flex:1}
.gate{margin-top:10px;padding:8px 10px;border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:6px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--amber)}
.gate button{color:inherit;text-decoration:underline;font-size:11.5px;margin-left:auto;white-space:nowrap}
.md{margin-top:13px;font-size:13px;line-height:1.7;color:var(--fg-2);white-space:pre-wrap}
.kv{display:flex;flex-direction:column;gap:3px;margin-top:9px;font-size:12px;color:var(--fg-2)}
.kv .k{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.03em}
.kv .box{border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--surface-hover);color:var(--fg-2);white-space:pre-wrap}
.sec{margin-top:16px;border-top:1px solid var(--border);padding-top:10px}
.sec-head{display:flex;align-items:center;gap:7px;height:22px}
.sec-head h3{margin:0;font-size:11.5px;font-weight:600;color:var(--fg)}
.sec-head .count{font-family:var(--mono);font-size:10px;color:var(--faint)}
.sec-head .chev{margin-left:auto;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint)}
.sec-head .chev:hover{background:var(--surface-hover);color:var(--fg)}
.sec-head .chev svg{width:11px;height:11px;transition:transform .12s}
.sec-head .chev.open svg{transform:rotate(180deg)}
.acc-row{display:flex;align-items:flex-start;gap:7px;padding:4px 0;font-size:12.5px;color:var(--fg-2)}
.acc-row input{margin:3px 0 0;accent-color:var(--brand)}
.acc-row.done span{color:var(--faint);text-decoration:line-through}
.acc-row.needs{background:var(--amber-soft);border-radius:4px;padding-left:5px}
.inline-add{width:100%;height:26px;margin-top:4px;border:0;border-bottom:1px dashed var(--border-strong);background:transparent;font-size:11.5px;color:var(--fg);outline:none}
.inline-add::placeholder{color:var(--faint)}
.child-row{display:flex;align-items:center;gap:6px;height:26px;padding:0 2px;border-radius:5px;font-size:11.5px;cursor:pointer;min-width:0}
.child-row:hover{background:var(--surface-hover)}
.child-row .ttl{font-size:11.5px}
.task-row{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11.5px;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:0}
.task-row .task-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .task-meta{margin-left:auto;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
.tl{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.tl-item{display:flex;gap:8px;font-size:11.5px;color:var(--muted);line-height:1.45}
.tl-time{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:78px;flex:none;padding-top:1px}
.create-row{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--surface);margin:3px 0}
.create-row .select{height:24px;width:62px;flex:none;padding:0 4px}
.create-row .input{height:24px;flex:1}
.create-row .hint{font-size:9.5px;color:var(--faint);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.create-row .hint.bad{color:var(--amber)}

/* View tools */
.view-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--border);flex:none}
.view-tools .spacer{flex:1}
.view-note{font-size:10.5px;color:var(--faint)}
.check{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.check input{accent-color:var(--brand);margin:0}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--faint)}
.legend b{font-weight:500;color:var(--muted)}

/* Board */
.board-wrap{flex:1;min-height:0;overflow:auto;display:flex;gap:9px;padding:11px}
.board-col{width:206px;flex:none;min-height:0;display:flex;flex-direction:column;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px}
.board-col-head{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--fg-2);flex:none}
.board-col-head .n{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-weight:400;margin-left:auto}
.board-cards{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--border-strong)}
.card-key{font-family:var(--mono);font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:4px}
.card-title{font-size:12px;line-height:1.4;color:var(--fg);margin-top:3px}
.card-foot{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:9.5px;color:var(--faint);font-family:var(--mono);min-height:16px}
.card-foot .unassigned{color:var(--amber)}
.card-foot .spacer{flex:1}

/* Matrix */
.matrix-wrap{flex:1;min-height:0;overflow:auto;padding:11px}
table.matrix{width:100%;min-width:720px;border-collapse:separate;border-spacing:0;font-size:11.5px}
.matrix th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;font-size:10px;letter-spacing:.05em;color:var(--faint);font-weight:500;font-family:var(--mono)}
.matrix td{border-bottom:1px solid var(--border);padding:5px 8px;vertical-align:middle;height:34px}
.matrix tr.group td{background:var(--surface-hover);font-size:11.5px;font-weight:600;color:var(--fg);height:30px;border-bottom:1px solid var(--border)}
.matrix tr.group:hover td{background:var(--surface-selected)}
.matrix .group-key{font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:5px}
.mx-chip{display:inline-flex;align-items:center;gap:5px;height:22px;max-width:100%;padding:0 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:10.5px;color:var(--fg-2)}
.mx-chip:hover{border-color:var(--border-strong);color:var(--fg)}
.mx-chip .ttl{font-size:10.5px;max-width:150px}
.mx-chip .dot{width:5px;height:5px}
.mx-miss{color:var(--faint);font-family:var(--mono);font-size:10px}
.mx-add{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 5px;border:1px dashed var(--border-strong);border-radius:5px;font-size:9.5px;color:var(--muted)}
.mx-add:hover{color:var(--fg);border-color:var(--muted)}
.mx-add svg{width:10px;height:10px}
.mx-waiver{font-size:9.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:2px 5px;white-space:nowrap}
.mx-input{width:100%;height:24px;border:1px solid var(--border-strong);border-radius:5px;padding:0 5px;background:var(--surface);font-size:10.5px;outline:none}

/* Gantt */
.gantt-wrap{flex:1;min-height:0;overflow:auto;padding:11px}
.gantt{min-width:880px}
.gantt-head{display:grid;grid-template-columns:240px minmax(600px,1fr);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;background:var(--surface)}
.gantt-head .left{padding:6px 8px;font-size:10px;color:var(--faint);font-family:var(--mono)}
.gantt-days{display:grid;grid-template-columns:repeat(14,1fr);border-left:1px solid var(--border)}
.gantt-day{border-right:1px solid var(--border);padding:6px 3px;font-family:var(--mono);font-size:9px;color:var(--faint);text-align:center}
.gantt-group{display:grid;grid-template-columns:240px minmax(600px,1fr);border-bottom:1px solid var(--border);background:var(--surface-hover)}
.gantt-group .left{padding:5px 8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.gantt-group .right{border-left:1px solid var(--border)}
.gantt-row{display:grid;grid-template-columns:240px minmax(600px,1fr);border-bottom:1px solid var(--border);min-height:32px}
.gantt-row:hover{background:var(--surface-hover)}
.gantt-left{display:flex;align-items:center;gap:5px;padding:0 8px;min-width:0;cursor:pointer}
.gantt-left .ttl{font-size:11px}
.gantt-track{position:relative;border-left:1px solid var(--border);background-image:repeating-linear-gradient(to right,transparent,transparent calc(100%/14 - 1px),var(--border) calc(100%/14 - 1px),var(--border) calc(100%/14))}
.bar{position:absolute;top:9px;height:14px;border-radius:4px;background:var(--brand);opacity:.82}
.bar.done{background:var(--green)}
.bar.draft{background:var(--faint)}
.today-line{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);opacity:.65;z-index:1}
.unscheduled{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
.unscheduled h4{margin:0 0 4px;font-size:11px;font-weight:600;color:var(--fg)}
.unscheduled .u-row{display:flex;align-items:center;gap:6px;height:26px;font-size:11px;color:var(--muted);cursor:pointer;border-radius:5px;padding:0 4px}
.unscheduled .u-row:hover{background:var(--surface-hover);color:var(--fg)}

/* Drawers */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.16)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:380px;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-float)}
.drawer.wide{width:460px}
.drawer-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);flex:none}
.drawer-head .t{font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-head .sub{font-family:var(--mono);font-size:10px;color:var(--faint)}
.drawer-head .spacer{flex:1}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:13px 14px}
.drawer-body.no-pad{padding:0}
.drawer-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:9px 14px;border-top:1px solid var(--border);flex:none}
.drawer-foot .spacer{flex:1}
.drawer .detail-scroll{padding:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em}
.field .select,.field .input{width:100%}
.radio-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:11.5px}
.radio-row:hover{background:var(--surface-hover)}
.radio-row.on{border-color:var(--brand);background:var(--brand-soft)}
.radio-row .mark{width:12px;height:12px;border-radius:50%;border:1px solid var(--border-strong);flex:none;display:inline-flex;align-items:center;justify-content:center}
.radio-row.on .mark{border-color:var(--brand)}
.radio-row.on .mark:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.radio-row .meta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.level-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.level-row:last-child{border-bottom:0}
.level-row .lv{font-family:var(--mono);font-size:10px;color:var(--faint);width:22px}
.level-row .name{color:var(--fg-2)}
.level-row .locked{font-size:9.5px;color:var(--faint);margin-left:auto}
.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--muted);margin:7px 0 10px}
.chain b{color:var(--fg);font-weight:600}
.impact{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:6px;padding:8px;font-size:11px;color:var(--amber);line-height:1.6}
.impact b{font-family:var(--mono)}
.gates{display:flex;flex-direction:column;gap:4px;margin-top:9px}
.gate-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.gate-row .lv{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:22px}
.gate-row .tag{font-size:9.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--faint)}
.bot-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:11.5px}
.bot-row:hover{background:var(--surface-hover)}
.bot-row.on{border-color:var(--brand);background:var(--brand-soft)}
.bot-row .role{font-size:9.5px;color:var(--faint);margin-left:auto}
.bot-row .load{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.ai-modes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ai-mode{height:24px;padding:0 8px;border:1px solid var(--border);border-radius:5px;font-size:10.5px;color:var(--muted)}
.ai-mode.on{background:var(--surface-selected);color:var(--fg);border-color:var(--border-strong)}
.ai-mode:disabled{opacity:.45;cursor:not-allowed}
.ai-preview{border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface-hover);font-size:11px;color:var(--fg-2);line-height:1.65}
.ai-preview .line{display:flex;gap:6px;margin:3px 0}
.ai-preview .line input{margin:3px 0 0;accent-color:var(--purple)}
.ai-preview .f{border-left:2px solid var(--border);padding-left:7px;margin:5px 0}
.ai-preview .f.blocker{border-color:var(--red)}
.ai-preview .f.warn{border-color:var(--amber)}
.ai-preview .f.ok{border-color:var(--green)}
.ai-preview .f b{font-weight:600;color:var(--fg)}
.ctx{font-family:var(--mono);font-size:9.5px;color:var(--faint);line-height:1.55;margin-top:8px;word-break:break-all}
.note{font-size:10.5px;color:var(--faint);line-height:1.55;margin-top:7px}
.warn-note{font-size:10.5px;color:var(--amber);line-height:1.55;margin-top:7px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.seg button{height:22px;padding:0 7px;border-radius:4px;font-size:10.5px;color:var(--muted)}
.seg button.on{background:var(--surface-selected);color:var(--fg)}

/* Toast */
.toast-root{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90}
.toast{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--brand);color:var(--brand-fg);box-shadow:var(--shadow-float);font-size:11.5px;white-space:nowrap}
.toast button{color:inherit;text-decoration:underline;font-size:11.5px}

@media (max-width:1280px){
  .workbench.with-chat{grid-template-columns:206px minmax(0,1fr) 340px}
}
@media (max-width:1100px){
  .head,.overview{padding-left:16px;padding-right:16px}
  .tabs{margin-left:16px;margin-right:16px}
  .workbench{padding:0 16px 12px;grid-template-columns:206px minmax(0,1fr)}
  .workbench.with-chat{grid-template-columns:206px minmax(0,1fr)}
  .chat-panel{position:fixed;top:0;right:0;bottom:0;width:380px;z-index:60;border-radius:0;box-shadow:var(--shadow-float)}
  .head .sub{display:none}
}
@media (max-width:900px){
  .workbench{grid-template-columns:1fr;grid-template-rows:250px minmax(0,1fr)}
  .workbench.with-chat{grid-template-columns:1fr;grid-template-rows:250px minmax(0,1fr)}
  .board-col{width:190px}
  .drawer{width:100%}
  .chat-panel{width:100%}
}

    if (!a || !it) return;
    const bot = state.bots.find((b) => b.id === a.botId) || state.bots[0];
    state.taskSeq += 1;
    const task = {
      id: `t-${state.taskSeq}`, key: `#${state.taskSeq}`, reqId: it.id, botId: bot ? bot.id : null,
      kind: "deliver", status: a.runNow ? "running" : "todo", title: String(a.title || it.title).slice(0, 120),
    };
    state.tasks.push(task);
    it.events.push({ at: Date.now(), text: `派给 ${bot ? bot.name : "未指定"} · 任务 ${task.key}` });
    if (it.status === "approved") it.status = "in_progress";
    if (state.gateError && state.gateError.id === it.id) state.gateError = null;
    const from = a.from;
    state.assign = null;
    state.drawer = from === "detail" ? { type: "detail", id: it.id } : null;
    toast(`已派给 ${bot ? bot.name : "未指定"} · 任务 ${task.key}`);
    render();
  }

  function aiAcceptance(it) {
    if (it.level === "us") {
      return [
        `Given 200 轮会话 / When 打开回放 / Then 3s 内定位到失败轮`,
        `When 点击失败轮 / Then 可复制 trace id 与 errorClass`,
      ];
    }
    return [
      `当打开 200 轮会话时，首屏可交互 ≤1.5s`,
      `当滚动历史时，p95 帧 ≤16ms，且不丢滚动位置`,
    ];
  }
  function aiChildren(it) {
    const next = nextLevel(it.level);
    if (!next) return [];
    return [
      `AI 草稿：${it.title} 的失败路径`,
      `AI 草稿：${it.title} 的可观测性`,
    ].map((x) => x.slice(0, 90));
  }
  function aiTasks(it) {
    return [
      `实现「${it.title}」的最小切片`,

  }
  function aiFindings(it) {
    const out = [];
    if ((it.level === "sr" || it.level === "us") && !(it.acceptance || []).length) out.push({ level: "blocker", text: "验收判据为空，无法判定完成" });
    if (isDelivery(it) && it.status === "approved" && !collectDeliverTasks(it).length) out.push({ level: "warn", text: "没有 deliver 任务，尚未派活" });
    if (it.level !== deliveryLevel() && !it.waiver && childrenOf(it).length === 0) out.push({ level: "blocker", text: "没有下游需求，链条在这里断了" });
    if (["in_progress", "verifying"].includes(it.status)) {
      const left = (it.acceptance || []).filter((a) => !a.done).length;
      if (left) out.push({ level: "warn", text: `还有 ${left} 条验收判据没勾选` });
    }
    if (it.status === "approved" && (it.acceptance || []).some((a) => /尽快|友好|优化|良好/.test(a.text))) out.push({ level: "warn", text: "验收里有模糊词（尽快 / 友好 / 优化），无法判定" });
    if (!out.length) out.push({ level: "ok", text: "未发现阻塞问题；仍建议人工确认验收口径" });

  }

  // ── 助手会话（全局助手 Bot，复用 Chat 界面） ───────────────────────
  const workspaceLabel = (w) => w === "worktree" ? "新 worktree" : w === "existing" ? "已有工作区" : "项目根";
  function dispatchPlan(it) {
    return {
      kind: "dispatch",
      items: [
        { title: `${it.title} · 实现`, botId: "b1", workspace: "project", runNow: false, checked: true },
        { title: `${it.title} · 失败路径`, botId: "b2", workspace: "worktree", runNow: false, checked: true },
      ],
    };
  }
  function createDispatchTasks(it, items, via) {
    let n = 0;
    items.filter((x) => x.checked !== false).forEach((x) => {
      state.taskSeq += 1;
      const b = state.bots.find((bot) => bot.id === x.botId);
      state.tasks.push({ id: `t-${state.taskSeq}`, key: `#${state.taskSeq}`, reqId: it.id, botId: x.botId, kind: "deliver", status: x.runNow ? "running" : "todo", title: x.title, workspace: x.workspace });
      it.events.push({ at: Date.now(), text: `助手${via || ""}派给 ${b ? b.name : "未指定"} · 任务 #${state.taskSeq}${x.runNow ? " · 已开跑" : ""}` });
      n += 1;
    });
    if (n && it.status === "approved") it.status = "in_progress";
    if (n) { state.chatAutoScroll = true; toast(`已派 ${n} 个任务`); }
    return n;
  }
  function nextMsgId() { state.chatSeq += 1; return `m-${state.chatSeq}`; }
  function ensureChat(it) {
    if (!it) return [];
    if (state.chats[it.id]) return state.chats[it.id];
    const msgs = [];
    const impl = collectDeliverTasks(it);
    if ((it.level === "sr" || it.level === "us") && !(it.acceptance || []).length) {
      msgs.push({ id: nextMsgId(), role: "assistant", text: `这条 ${shortKey(it.key)} 还没有验收判据。我按上游和正文起了 2 条，你勾选后再应用。`, proposal: { kind: "acceptance", items: aiAcceptance(it).map((text) => ({ text, checked: true })) } });
    } else if (it.level !== deliveryLevel() && childrenOf(it).length === 0) {
      msgs.push({ id: nextMsgId(), role: "assistant", text: `这条 ${shortKey(it.key)} 还没有下游。要我拆出 2 条 ${levelName(nextLevel(it.level))} 草稿吗？`, proposal: { kind: "children", items: aiChildren(it).map((title) => ({ title, checked: true })) } });

      msgs.push({ id: nextMsgId(), role: "assistant", text: `这条 ${shortKey(it.key)} 已批准，但还没派活。我可以拆成 2 个任务，分别给小B和小C；工作区和是否开跑由你定。`, proposal: dispatchPlan(it) });
    } else {
      msgs.push({ id: nextMsgId(), role: "assistant", text: `我读过了 ${shortKey(it.key)}。你可以说「补验收」「拆下游」「派活」「看进度」或「检查质量」，也可以直接问别的。` });
    }
    state.chats[it.id] = msgs;
    return msgs;
  }


  function helpItems() {
    return [
      { text: "项目页 → 添加项目", target: "projects" },
      { text: "需求页 → ＋ 新建需求", target: "pool" },
      { text: "看板：按状态看交付", target: "board" },
      { text: "追溯矩阵：看断链", target: "matrix" },
      { text: "详情「问小A同学」→ 让助手补验收 / 派活", target: "chat" },
      { text: "裁剪与字段 → 改层级", target: "tailor" },
    ];
  }
  function ensureHomeChat() {
    if (state.homeChat.length) return state.homeChat;
    state.homeChat.push({ id: nextMsgId(), role: "assistant", text: "我是小A同学。可以问软件怎么用、跨项目汇总，或让我给某个需求派活。", proposal: { kind: "overview", items: homeOverviewItems() } });
    return state.homeChat;
  }
  function homeOverviewItems() {
    const vis = visibleItems();
    const gaps = vis.filter((i) => gapOf(i)).length;
    const unassigned = vis.filter((i) => isDelivery(i) && i.status === "approved" && !collectDeliverTasks(i).length).length;
    return [
      { text: `CMH · ${vis.length} 条需求 · ${gaps} 个缺口 · ${unassigned} 条未派活`, target: "pool", label: "需求池" },
      { text: "看板：按状态看交付层", target: "board", label: "打开看板" },
      { text: "追溯矩阵：看断链在哪", target: "matrix", label: "打开矩阵" },
      { text: "裁剪与字段：改层级 / 影响预览", target: "tailor", label: "打开裁剪" },
    ];
  }
  function homeQuickHtml() {
    return [
      `<button data-chat-quick="help">怎么用</button>`,
      `<button data-chat-quick="unassigned">哪些没派活</button>`,
      `<button data-chat-quick="acceptance">哪些验收没过</button>`,
      `<button data-chat-quick="gaps">看缺口</button>`,
      `<button data-home-go="board">打开看板</button>`,
      `<button data-home-go="tailor">裁剪</button>`,
    ].join("");
  }
  function homeResults(kind) {
    const vis = visibleItems();
    if (kind === "unassigned") {
      const list = vis.filter((i) => isDelivery(i) && i.status === "approved" && !collectDeliverTasks(i).length);
      return { title: "未派活", list, meta: "已批准 · 没有 deliver 任务", focus: "assign" };
    }
    if (kind === "acceptance") {
      const list = vis.filter((i) => (i.level === "sr" || i.level === "us") && (i.acceptance || []).some((a) => !a.done));
      return { title: "验收没过", list, meta: (i) => `${(i.acceptance || []).filter((a) => !a.done).length} 条未勾`, focus: "acc" };
    }
    const list = vis.filter((i) => gapOf(i));
    return { title: "缺口", list, meta: (i) => gapOf(i)?.label || "", focus: "children" };
  }
  function homeReply(kind) {
    if (kind === "help") {
      return { id: nextMsgId(), role: "assistant", text: "先说你要做什么。常用入口：", proposal: { kind: "help", items: helpItems() } };
    }
    if (kind === "board") return { id: nextMsgId(), role: "assistant", text: "已打开看板。", navigate: "board" };
    if (kind === "tailor") return { id: nextMsgId(), role: "assistant", text: "已打开裁剪与字段。", navigate: "tailor" };
    if (kind === "unassigned" || kind === "acceptance" || kind === "gaps") {
      const r = homeResults(kind);
      if (!r.list.length) return { id: nextMsgId(), role: "assistant", text: `当前没有${r.title}。` };
      return { id: nextMsgId(), role: "assistant", text: `当前 ${r.list.length} 条：`, proposal: { kind: "results", title: r.title, items: r.list.map((i) => ({ reqId: i.id, text: `${shortKey(i.key)} ${i.title}`, meta: typeof r.meta === "function" ? r.meta(i) : r.meta, focus: r.focus })) } };
    }
    return { id: nextMsgId(), role: "assistant", text: "我可以帮你查「哪些没派活 / 哪些验收没过 / 哪里断链」，也可以「打开看板 / 裁剪」，或者直接问怎么用。" };
  }
  function askHome(kind) {
    if (state.pending) { toast("先停止当前回复"); return; }
    state.chatMode = "home";
    state.chatOpen = true;
    state.chatAutoScroll = true;
    const prompts = { help: "这个软件怎么用", unassigned: "哪些需求还没派活", acceptance: "哪些验收没过", gaps: "哪里断链了", board: "打开看板", tailor: "打开裁剪" };
    state.homeChat.push({ id: nextMsgId(), role: "user", text: prompts[kind] || "帮我看看" });
    const reply = homeReply(kind);
    reply.steps = pathForHome(kind);
    if (reply.navigate) { state.homeChat.pop(); navigateTo(reply.navigate); return; }
    state.focus = "[data-chat-input]";
    streamReply(state.homeChat, reply);
  }
  function sendHomeChat(text) {
    if (state.pending) { toast("先停止当前回复"); return; }
    const v = String(text || "").trim();
    if (!v) return;
    state.homeChat.push({ id: nextMsgId(), role: "user", text: v });
    const kind = /怎么用|用法|帮助|教程|指南|设置在哪/.test(v) ? "help"
      : /看板/.test(v) ? "board"
      : /裁剪|层级/.test(v) ? "tailor"
      : /验收/.test(v) ? "acceptance"
      : /缺口|断链/.test(v) ? "gaps"
      : /没派活|未派活|哪些/.test(v) ? "unassigned"
      : "none";

    state.chatAutoScroll = true;

  function focusTarget(target) {
    if (!target) return;
    if (["pool", "board", "matrix", "plan", "tailor", "chat", "projects"].includes(target)) { navigateTo(target); return; }
    const map = { impl: ".impl", assign: "[data-assign]", acc: "[data-accept-input]", tasks: '[data-section="tasks"]', children: '[data-section="children"]', filters: ".filter-row", new: '[data-action="new"]', chatInput: "[data-chat-input]" };
    const el = document.querySelector(map[target] || "");
    if (!el) return;
    el.scrollIntoView({ block: "center", behavior: "smooth" });

  }

  function navigateTo(target, focus) {
    if (target === "tailor") { state.chatOpen = false; openTailor(); return; }

    if (target === "projects") { toast("原型：项目页在 rail「工作台」里；先切项目再建需求"); return; }

  function chatPanelHtml() {
    const home = state.chatMode === "home";

      state.filters.level !== "all" ? `层级 ${levelName(state.filters.level)}` : "",
      state.filters.status !== "all" ? `状态 ${statusLabel(state.filters.status)}` : "",

  function proposalHtml(m) {

      }).join("");
    } else if (p.kind === "dispatch") {
      rows = p.items.map((x, i) => {
