    } else if (p.kind === "stop") {
      rows = p.items.map((x, i) => {
        const t = x.task;
        const b = state.bots.find((bot) => bot.id === x.botId);
        const mins = t.startedAt ? Math.max(1, Math.round((Date.now() - t.startedAt) / 60000)) : null;
        return `<div class="prop-row"><input type="checkbox" data-prop-check="${m.id}:${i}" ${x.checked ? "checked" : ""}/><div class="prop-main"><b>${esc(t.key)} ${esc(t.title)}</b><div class="prop-meta">${b ? avatar(b) : ""} ${esc(b ? b.name : "未指定")} · ${t.status === "running" ? "运行中" : t.status === "cancelled" ? "已停止" : t.status === "done" ? "完成" : "待开跑"}${mins ? ` · ${mins}m` : ""}</div><div class="prop-meta">原因：${esc(x.reason || "你要求停止")}</div></div></div>`;
      }).join("");
    } else if (p.kind === "close") {
      rows = p.items.map((text) => `<div class="finding ${p.canClose ? "ok" : "warn"}"><b>${p.canClose ? "通过" : "不能关"}</b> ${esc(text)}</div>`).join("");
    } else if (p.kind === "help") {
      rows = p.items.map((x) => `<div class="help-row"><span>${esc(x.text)}</span><button class="btn tiny" data-help-open="${esc(x.target)}">带我去</button></div>`).join("");
    } else if (p.kind === "overview") {
      rows = p.items.map((x) => `<div class="help-row"><span>${esc(x.text)}</span><button class="btn tiny" data-home-go="${esc(x.target)}">${esc(x.label)}</button></div>`).join("");
    } else if (p.kind === "results") {
      rows = p.items.map((x) => `<button class="result-row" data-result-select="${x.reqId}" data-focus="${x.focus || ""}"><span class="key">${esc(x.text.split(" ")[0])}</span><span class="ttl">${esc(x.text.split(" ").slice(1).join(" "))}</span><span class="prop-meta">${esc(x.meta)}</span></button>`).join("");
    } else {
      rows = p.items.map((x, i) => `<label class="prop-row"><input type="checkbox" data-prop-check="${m.id}:${i}" ${x.checked ? "checked" : ""}/><span>${esc(x.text || x.title)}</span></label>`).join("");
    }
    const foot = (p.kind === "check" || p.kind === "status" || p.kind === "help" || p.kind === "overview" || p.kind === "results")
      ? `<button class="btn tiny" data-prop-dismiss="${m.id}">知道了</button>`
      : p.kind === "close"
        ? (p.canClose
          ? `<button class="btn tiny" data-prop-dismiss="${m.id}">取消</button><button class="btn primary tiny" data-prop-apply="${m.id}">批准关闭</button>`
          : `<button class="btn tiny" data-prop-dismiss="${m.id}">知道了</button>`)
        : p.kind === "stop"
          ? `<button class="btn tiny" data-prop-dismiss="${m.id}">取消</button><button class="btn primary tiny" data-prop-apply="${m.id}">批准停止</button>`
          : `<button class="btn tiny" data-prop-dismiss="${m.id}">忽略</button><button class="btn primary tiny" data-prop-apply="${m.id}">${p.kind === "dispatch" ? "批准并派活" : "应用选中"}</button>`;
    const grant = p.kind === "dispatch"
      ? `<div class="proposal-grant"><label class="mini-check"><input type="checkbox" data-mandate-session="${m.id}" ${state.mandateDraft ? "checked" : ""}/> 本会话内自动派活（可撤销）</label></div>`
      : "";
    return `<div class="proposal"><div class="proposal-head"><span class="chip">${esc(chipName)}</span>${title}</div>${rows}${grant}<div class="proposal-foot">${foot}</div></div>`;
  }

  function chatQuickHtml(it) {
    const chips = [["help", "怎么用"]];
    if (it.level === "sr" || it.level === "us") chips.push(["acceptance", "补验收"]);
    if (nextLevel(it.level)) chips.push(["children", `拆 ${levelName(nextLevel(it.level))}`]);
    if (isDelivery(it) && ["approved", "in_progress", "verifying"].includes(it.status) && !collectDeliverTasks(it).length) chips.push(["dispatch", "派活"]);
    chips.push(["status", "看进度"]);
    if ([...collectDeliverTasks(it), ...collectVerifyTasks(it)].some((t) => t.status === "running")) chips.push(["stop", "停跑"]);
    chips.push(["check", "检查质量"]);
    return chips.map(([k, label]) => `<button data-chat-quick="${k}">${label}</button>`).join("");
  }

  function chatReply(it, kind) {
    if (kind === "acceptance") {
      if (it.level !== "sr" && it.level !== "us") return { id: nextMsgId(), role: "assistant", text: "这一层没有验收判据；先拆到 SR / US，再来补验收。" };
      if (it.status === "approved") return { id: nextMsgId(), role: "assistant", text: "已批准的需求不允许 AI 覆盖正文 / 验收。要新建一条草稿吗？" };
      return { id: nextMsgId(), role: "assistant", text: "我按上游和正文起了 2 条，勾选后应用：", proposal: { kind: "acceptance", items: aiAcceptance(it).map((text) => ({ text, checked: true })) } };
    }
    if (kind === "children") {
      if (!nextLevel(it.level)) return { id: nextMsgId(), role: "assistant", text: "这是交付层，没有下游需求。要我派活吗？" };
      return { id: nextMsgId(), role: "assistant", text: `我按这一层拆了 2 条 ${levelName(nextLevel(it.level))} 草稿：`, proposal: { kind: "children", items: aiChildren(it).map((title) => ({ title, checked: true })) } };
    }
    if (kind === "dispatch") {
      if (!isDelivery(it)) return { id: nextMsgId(), role: "assistant", text: "先拆到交付层，再派活；我可以先出下游草稿。" };
      if (it.status === "draft" || it.status === "reviewing") return { id: nextMsgId(), role: "assistant", text: "批准后才能派活；现在先把验收写清楚。" };
      const existing = collectDeliverTasks(it);
      if (mandateOf(it).dispatch) {
        const plan = dispatchPlan(it);
        const n = createDispatchTasks(it, plan.items, "按授权");
        return { id: nextMsgId(), role: "assistant", text: `已按你的授权派活：小B / 小C（${n} 个任务）。`, proposal: { ...plan, applied: true, appliedCount: n } };
      }
      if (existing.length) {
        return { id: nextMsgId(), role: "assistant", text: `已经有 ${existing.length} 个实现任务在跑；要加派、改派还是先看进度？`, proposal: { kind: "status", items: existing.map((t) => ({ task: t, botId: t.botId })) } };
      }
      return { id: nextMsgId(), role: "assistant", text: "我可以拆成 2 个任务，分别给小B和小C；工作区和是否开跑由你定，批准后我才派。", proposal: dispatchPlan(it) };
    }
    if (kind === "stop") {
      const running = [...collectDeliverTasks(it), ...collectVerifyTasks(it)].filter((t) => t.status === "running");
      if (!running.length) return { id: nextMsgId(), role: "assistant", text: "现在没有运行中的任务；已完成或待开跑的任务不能停。" };
      return { id: nextMsgId(), role: "assistant", text: `有 ${running.length} 个运行中任务。停之前先看状态：`, proposal: { kind: "stop", items: running.map((t) => ({ task: t, botId: t.botId, reason: "你要求停止", checked: true })) } };
    }
    if (kind === "close") {
      const missing = [];
      const impl = collectDeliverTasks(it);
      const acc = it.acceptance || [];
      const ver = collectVerifyTasks(it);
      const openImpl = impl.filter((t) => t.status !== "done").length;
      const openAcc = acc.filter((a) => !a.done).length;
      const openVer = ver.filter((t) => t.status !== "done").length;
      if (!impl.length) missing.push("还没有 deliver 任务");
      else if (openImpl) missing.push(`${openImpl} 个实现任务未完成`);
      if (!(it.level === "sr" || it.level === "us")) missing.push("这一层没有验收判据");
      else if (!acc.length) missing.push("还没有验收判据");
      else if (openAcc) missing.push(`${openAcc} 条验收判据没勾选`);
      if (openVer) missing.push(`${openVer} 个验收任务未完成`);
      if (missing.length) return { id: nextMsgId(), role: "assistant", text: `还不能关。先看任务情况：`, proposal: { kind: "close", canClose: false, items: missing } };
      return { id: nextMsgId(), role: "assistant", text: "任务和验收都齐了，可以提交关闭；确认后我关：", proposal: { kind: "close", canClose: true, items: ["所有 deliver 已完成", "验收判据已全部勾选", "验收任务已完成"] } };
    }
    if (kind === "status") {
      const impl = collectDeliverTasks(it);
      const verify = collectVerifyTasks(it);
      if (!impl.length && !verify.length) return { id: nextMsgId(), role: "assistant", text: "这条还没派活。要出一个派活计划吗？" };
      return { id: nextMsgId(), role: "assistant", text: `当前 ${impl.length} 个实现任务、${verify.length} 个验收任务：`, proposal: { kind: "status", items: [...impl, ...verify].map((t) => ({ task: t, botId: t.botId })) } };
    }
    if (kind === "help") {
      return { id: nextMsgId(), role: "assistant", text: "先说你要做什么。常用入口：", proposal: { kind: "help", items: helpItems() } };
    }
    if (kind === "check") {
      return { id: nextMsgId(), role: "assistant", text: "只读检查，不改任何字段：", proposal: { kind: "check", items: aiFindings(it) } };
    }
    return { id: nextMsgId(), role: "assistant", text: "我先读一遍上游、验收和关联任务。你可以说「补验收」「拆下游」「派活」「看进度」或「检查质量」。" };
  }

  function stopStream() {
    const p = state.pending;
    if (!p) return;
    clearInterval(p.timer);
    p.msg.streaming = false;
    p.msg.stopped = true;
    p.msg.text = (p.msg.text || "") + " …已停止";
    state.pending = null;
    state.chatAutoScroll = true;
    render();
  }
  function streamReply(msgs, reply) {
    if (state.pending) stopStream();
    const msg = { id: nextMsgId(), role: "assistant", text: "", streaming: true, steps: reply.steps || [], proposal: null };
    msgs.push(msg);
    const full = String(reply.text || "");
    state.pending = { msg, full, i: 0, timer: null };
    state.chatAutoScroll = true;
    if (!full) {
      msg.streaming = false;
      msg.proposal = reply.proposal || null;
      state.pending = null;
      render();
      return;
    }
    state.pending.timer = setInterval(() => {
      const p = state.pending;
      if (!p || p.msg !== msg) return;
      p.i = Math.min(full.length, p.i + 2);
      msg.text = full.slice(0, p.i);
      state.chatAutoScroll = true;
      if (p.i >= full.length) {
        clearInterval(p.timer);
        msg.streaming = false;
        msg.proposal = reply.proposal || null;
        state.pending = null;
      }
      render();
    }, 28);
    render();
  }

  function askChat(kind) {
    if (state.pending) { toast("先停止当前回复"); return; }
    const it = byId(state.selectedId);
    if (!it) return;
    state.chatOpen = true;
    state.chatAutoScroll = true;
    const msgs = ensureChat(it);
    const existing = msgs.find((m) => m.proposal && m.proposal.kind === kind && !m.proposal.applied && !m.proposal.dismissed);
    if (existing && !["check", "status", "stop", "close"].includes(kind)) {
      state.chatOpen = true;
      state.chatAutoScroll = true;
      state.focus = "[data-chat-input]";
      render();
      return;
    }
    const prompts = {
      help: "这个软件怎么用",
      acceptance: "帮我补两条验收判据",
      children: "拆出下游草稿",
      dispatch: "把这条拆成任务派给小B和小C",
      status: "看看谁在跑、谁卡住了",
      stop: "把小B 跑着的任务停掉",
      close: "这条需求可以关了吗",
      check: "检查一下这条需求有没有缺口",
    };
    msgs.push({ id: nextMsgId(), role: "user", text: prompts[kind] || "帮我看看这条需求" });
    const reply = chatReply(it, kind);
    reply.steps = pathFor(kind, it);
    state.drawer = null;
    state.focus = "[data-chat-input]";
    streamReply(msgs, reply);
  }

  function sendChat(text) {
    if (state.pending) { toast("先停止当前回复"); return; }
    const it = byId(state.selectedId);
    const v = String(text || "").trim();
    if (!it || !v) return;
    const msgs = ensureChat(it);
    msgs.push({ id: nextMsgId(), role: "user", text: v });
    const kind = /怎么用|用法|帮助|教程|指南|设置在哪|guide/.test(v) ? "help"
      : /验收/.test(v) ? "acceptance"
      : /拆.*下游|下游|拆.*IR|拆.*SR|拆.*US/.test(v) ? "children"
      : /关|关闭|结项|完成这条/.test(v) ? "close"
      : /停|取消|终止/.test(v) ? "stop"
      : /派活|派一个|再派|交给|让小|分配给|给小|加派|改派/.test(v) ? "dispatch"
      : /进度|卡住|状态|谁在|跑/.test(v) ? "status"
      : /任务/.test(v) ? "dispatch"
      : /检查|质量|风险|缺口/.test(v) ? "check"
      : "none";
    const reply = chatReply(it, kind);
    reply.steps = pathFor(kind, it);
    state.chatDraft = "";
    state.chatAutoScroll = true;
    state.focus = "[data-chat-input]";
    streamReply(msgs, reply);
  }

  function retryMessage(mid) {
    if (state.pending) { toast("先停止当前回复"); return; }
    const home = state.chatMode === "home";
    const it = byId(state.selectedId);
    const msgs = home ? state.homeChat : (it ? ensureChat(it) : []);
    const idx = msgs.findIndex((x) => x.id === mid);
    if (idx < 0) return;
    let u = -1;
    for (let i = idx - 1; i >= 0; i -= 1) if (msgs[i].role === "user") { u = i; break; }
    if (u < 0) return;
    const text = msgs[u].text;
    msgs.splice(u);
    if (home) sendHomeChat(text); else sendChat(text);
  }

  function applyProposal(mid) {
    const it = byId(state.selectedId);
    if (!it) return;
    const msgs = ensureChat(it);
    const m = msgs.find((x) => x.id === mid);
    const p = m && m.proposal;
    if (!p || p.applied || p.dismissed || p.kind === "check" || p.kind === "status") return;
    if (p.kind === "close") {
      if (!p.canClose) return;
      it.status = "done";
      it.events.push({ at: Date.now(), text: "助手按任务与验收结果提交关闭，人已确认" });
      p.applied = true; p.appliedCount = 1;
      state.chatAutoScroll = true;
      toast("已关闭需求");
      render();
      return;
    }
    const chosen = p.items.filter((x) => x.checked);
    if (!chosen.length) { toast("没有勾选任何条目"); return; }
    if (p.kind === "acceptance") {
      chosen.forEach((x) => it.acceptance.push({ text: x.text, done: false }));
      it.events.push({ at: Date.now(), text: `AI 起草验收判据（${chosen.length} 条）` });
      if (state.gateError && state.gateError.id === it.id) state.gateError = null;
    } else if (p.kind === "children") {
      chosen.forEach((x) => addItem({ level: nextLevel(it.level), parentId: it.id, title: x.title, ai: true, select: false }));
      state.expanded.add(it.id);
      it.events.push({ at: Date.now(), text: `AI 生成下游草稿（${chosen.length} 条）` });
    } else if (p.kind === "dispatch") {
      const n = createDispatchTasks(it, chosen, "批准");
      if (state.mandateDraft) {
        state.mandate[it.id] = { dispatch: true };
        state.mandateDraft = false;
        toast("已授权：本会话内自动派活");
      }
      p.applied = true; p.appliedCount = n;
      state.chatAutoScroll = true;
      if (state.gateError && state.gateError.id === it.id) state.gateError = null;
      render();
      return;
    } else if (p.kind === "stop") {
      chosen.forEach((x) => {
        x.task.status = "cancelled";
        const b = state.bots.find((bot) => bot.id === x.botId);
        it.events.push({ at: Date.now(), text: `助手停止 ${b ? b.name : "未指定"} · 任务 ${x.task.key}（${x.reason || "人确认"}）` });
      });
      p.applied = true; p.appliedCount = chosen.length;
      state.chatAutoScroll = true;
      toast(`已停止 ${chosen.length} 个 run`);
      render();
      return;
    }
    p.applied = true;
    p.appliedCount = chosen.length;
    state.chatAutoScroll = true;
    toast(`已应用 ${chosen.length} 条 AI 草稿`);
    render();
  }

  function dismissProposal(mid) {
    const it = byId(state.selectedId);
    if (!it) return;
    const msgs = ensureChat(it);
    const m = msgs.find((x) => x.id === mid);
    if (!m || !m.proposal || m.proposal.applied) return;
    m.proposal.dismissed = true;
    if (m.proposal.kind === "dispatch") state.mandateDraft = false;
    state.chatAutoScroll = true;
    render();
  }

  // ── tailoring ──────────────────────────────────────────────────────
  function openTailor() {
    state.tailoringDraft = [...state.profile.levels];
    state.drawer = { type: "tailor" };
    render();
  }
  function setTemplate(key) {
    if (!state.tailoringDraft) return;
    if (key === "custom") return;
    state.tailoringDraft = [...TPL[key].levels];
    render();
  }
  function toggleLevel(lv) {
    if (!state.tailoringDraft || lv === "rr") return;
    const set = new Set(state.tailoringDraft);
    if (set.has(lv)) set.delete(lv); else set.add(lv);
    state.tailoringDraft = LEVELS.filter((l) => set.has(l));
    render();
  }
  function reparentCount(lv) {
    const draft = state.tailoringDraft || [];
    return state.items.filter((i) => enabled().includes(i.level) && draft.includes(i.level) && i.level !== "rr" && (() => {
      let p = i.parentId ? byId(i.parentId) : null;
      while (p) {
        if (p.level === lv) return true;
        if (draft.includes(p.level)) return false;
        p = p.parentId ? byId(p.parentId) : null;
      }
      return false;
    })()).length;
  }
  function saveTailor() {
    const draft = state.tailoringDraft || [];
    if (draft.length < 2) return;
    const prev = [...state.profile.levels];
    if (draft.join(",") === prev.join(",")) { state.drawer = null; render(); return; }
    state.profile.levels = [...draft];
    state.profile.template = templateOf(draft);
    ensureSelection();
    state.drawer = null;
    state.undo = { kind: "levels", prev };
    toast(`已改为 ${templateLabel(draft)}（${chainLabel(draft)}）`, true);
    render();
  }
  function undoLast() {
    if (!state.undo || state.undo.kind !== "levels") return;
    state.profile.levels = [...state.undo.prev];
    state.profile.template = templateOf(state.profile.levels);
    state.undo = null;
    state.toast = null;
    ensureSelection();
    toast("已撤销裁剪");
    render();
  }

  // ── render ─────────────────────────────────────────────────────────
  function render() {
    ensureSelection();
    const active = document.activeElement;
    const chatFocused = !!(active && active.matches && active.matches("[data-chat-input]"));
    const chatCaret = chatFocused ? active.selectionStart : null;
    const treeTop = document.querySelector("#treeScroll")?.scrollTop || 0;
    const detailTop = document.querySelector("#detailScroll")?.scrollTop || 0;
    const drawerTop = document.querySelector(".drawer .detail-scroll")?.scrollTop || 0;
    const chatTop = document.querySelector("#chatBody")?.scrollTop || 0;

    renderOverview();
    renderTabs();
    renderWorkbench();
    renderDrawer();
    renderToast();
    renderMenu();

    const t2 = document.querySelector("#treeScroll"); if (t2) t2.scrollTop = treeTop;
    const d2 = document.querySelector("#detailScroll"); if (d2) d2.scrollTop = state.resetDetail ? 0 : detailTop;
    const dd = document.querySelector(".drawer .detail-scroll"); if (dd) dd.scrollTop = drawerTop;
    const cb = document.querySelector("#chatBody");
    if (cb) cb.scrollTop = state.chatAutoScroll ? cb.scrollHeight : chatTop;
    if (state.chatAutoScroll) state.chatAutoScroll = false;
    state.resetDetail = false;
    if (chatFocused) {
      const input = document.querySelector("[data-chat-input]");
      if (input) { input.focus(); if (chatCaret != null) { try { input.setSelectionRange(chatCaret, chatCaret); } catch {} } }
    }
    focusPending();
  }

  function renderOverview() {
    const vis = visibleItems();
    const approved = vis.filter((i) => i.status === "approved").length;
    const reviewing = vis.filter((i) => i.status === "reviewing").length;
    const gaps = vis.filter((i) => gapOf(i)).length;
    const unassigned = vis.filter((i) => isDelivery(i) && i.status === "approved" && !collectDeliverTasks(i).length).length;
    document.getElementById("overview").innerHTML = `
      <span>需求 <b>${vis.length}</b></span><span class="sep">·</span>
      <span>已批准 <b>${approved}</b></span><span class="sep">·</span>
      <span>待评审 <b>${reviewing}</b></span><span class="sep">·</span>
      <span class="${gaps ? "warn" : ""}">未覆盖 <b>${gaps}</b></span><span class="sep">·</span>
      <span class="${unassigned ? "warn" : ""}">未派活 <b>${unassigned}</b></span>
    `;
  }

  function renderTabs() {
    const tabs = [
      { id: "pool", label: "需求池", phase: "" },
      { id: "board", label: "看板", phase: "M2" },
      { id: "plan", label: "计划", phase: "M3" },
      { id: "matrix", label: "追溯矩阵", phase: "" },
    ];
    document.getElementById("tabs").innerHTML = tabs.map((t) => `
      <button class="tab ${state.tab === t.id ? "on" : ""}" data-tab="${t.id}" role="tab" aria-selected="${state.tab === t.id}">
        ${t.label}${t.phase ? `<span class="phase">${t.phase}</span>` : ""}
      </button>`).join("");
  }

  function renderWorkbench() {
    const wb = document.getElementById("workbench");
    const chat = state.chatOpen ? chatPanelHtml() : "";
    if (state.tab === "pool") {
      wb.className = "workbench" + (state.chatOpen ? " with-chat" : "");
      wb.innerHTML = treeHtml() + detailPanelHtml() + chat;
    } else {
      wb.className = "workbench single" + (state.chatOpen ? " with-chat" : "");
      wb.innerHTML = (state.tab === "board" ? boardHtml() : state.tab === "plan" ? ganttHtml() : matrixHtml()) + chat;
    }
  }

  function isFiltering() {
    return !!state.filters.query.trim() || state.filters.level !== "all" || state.filters.status !== "all";
  }
  function matches(it) {
    const q = state.filters.query.trim().toLowerCase();
    if (q && !(`${it.title} ${it.key} ${it.body || ""}`.toLowerCase().includes(q))) return false;
    if (state.filters.level !== "all" && it.level !== state.filters.level) return false;
    if (state.filters.status !== "all" && it.status !== state.filters.status) return false;
    return true;
  }

  function treeHtml() {
    return `<aside class="panel tree-panel">
      <div class="tree-tools">
        <input class="input" data-search placeholder="搜索标题 / key / 正文" value="${esc(state.filters.query)}" aria-label="搜索需求" />
        <div class="filter-row">
          <select class="select" data-filter-level aria-label="按层级筛选">
            <option value="all">全部层级</option>
            ${enabled().map((lv) => `<option value="${lv}" ${state.filters.level === lv ? "selected" : ""}>${levelName(lv)}</option>`).join("")}
          </select>
          <select class="select" data-filter-status aria-label="按状态筛选">
            <option value="all">全部状态</option>
            ${STATUS_ORDER.map((s) => `<option value="${s}" ${state.filters.status === s ? "selected" : ""}>${statusLabel(s)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="tree-scroll" id="treeScroll">${treeRowsHtml()}</div>
    </aside>`;
  }

  function createRowHtml(context, level, parentId, compact) {
    const parent = parentId ? byId(parentId) : null;
    const valid = level === "rr" || !!parent;
    return `<div class="create-row">
      ${compact ? "" : `<select class="select" data-create-level aria-label="新建层级">${enabled().map((l) => `<option value="${l}" ${l === level ? "selected" : ""}>${levelName(l)}</option>`).join("")}</select>`}
      <input class="input" data-create-input placeholder="${valid ? "标题，回车创建" : "先建上一级"}" value="${esc(state.creating?.title || "")}" ${valid ? "" : "disabled"} aria-label="新需求标题" />
      <span class="hint ${valid ? "" : "bad"}">${level === "rr" ? "根" : parent ? `父 ${shortKey(parent.key)}` : "缺父项"}</span>
    </div>`;
  }

  function treeRowsHtml() {
    const out = [];
    if (state.creating?.context === "tree") out.push(createRowHtml("tree", state.creating.level, state.creating.parentId, false));
    const flat = isFiltering();
    const list = flat ? visibleItems().filter(matches).sort((a, b) => a.seq - b.seq) : null;
    if (flat) {
      if (!list.length) return out.join("") + `<div class="inline-empty">没有匹配的需求</div>`;
      for (const it of list) {
        const path = ancestors(it).slice(0, -1).map((a) => shortKey(a.key)).join(" / ");
        out.push(treeRowHtml(it, 0, false, path));
      }
      return out.join("");
    }
    const walk = (it, depth) => {
      out.push(treeRowHtml(it, depth, true, ""));
      if (state.expanded.has(it.id)) for (const c of childrenOf(it)) walk(c, depth + 1);
    };
    const rs = roots();
    if (!rs.length) return out.join("") + `<div class="inline-empty">还没有需求。点右上「新建需求」开始。</div>`;
    for (const r of rs) walk(r, 0);
    return out.join("");
  }

  function treeRowHtml(it, depth, canExpand, path) {
    const kids = childrenOf(it);
    const open = state.expanded.has(it.id);
    const on = state.selectedId === it.id;
    const impl = isDelivery(it) ? implementers(it) : [];
    return `<div class="tree-row ${on ? "on" : ""}" data-select="${it.id}" style="padding-left:${5 + depth * 14}px" title="${esc(it.title)}">
      ${canExpand && kids.length
        ? `<button class="chev ${open ? "open" : ""}" data-expand="${it.id}" title="${open ? "收起" : "展开"}" aria-label="${open ? "收起" : "展开"}" aria-expanded="${open}">${ICON.chev}</button>`
        : `<span class="chev-space"></span>`}
      ${dot(it.status)}
      <span class="key">${shortKey(it.key)}</span>
      <span class="ttl">${esc(it.title)}</span>
      ${path ? `<span class="path" title="${esc(path)}">${esc(path)}</span>` : ""}
      <span class="row-end">${impl.length ? avatarStack(impl) : ""}${it.ai ? `<span class="chip ai">AI</span>` : ""}${gapChip(it)}</span>
    </div>`;
  }

  function detailPanelHtml() {
    const it = byId(state.selectedId) || visibleItems()[0];
    if (!it) return `<section class="panel detail-panel"><div class="empty"><h3>还没有需求</h3><div>从一个客户原话或一条内部想法开始。</div><button class="btn tiny" data-action="new">${ICON.plus} 新建需求</button></div></section>`;
    return `<section class="panel detail-panel"><div class="detail-scroll" id="detailScroll">${detailHtml(it)}</div></section>`;
  }

  function detailHtml(it) {
    const chain = ancestors(it);
    const sup = assistant();
    const impl = implementers(it);
    const stats = taskStats(it);
    const tasks = collectDeliverTasks(it);
    const accNeeds = state.gateError && state.gateError.id === it.id && state.gateError.key === "acceptance";
    return `
      <div class="crumbs">
        ${chain.map((n, i) => `<button data-select="${n.id}" title="${esc(n.title)}">${shortKey(n.key)}</button>${i < chain.length - 1 ? "<span>→</span>" : ""}`).join("")}
      </div>
      <div class="detail-title">
        <div class="detail-key">${esc(it.key)}${it.ai ? ` · <span class="chip ai">AI 草稿</span>` : ""}</div>
        <div class="title-row">
          <h2>${esc(it.title)}</h2>
          <button class="btn tiny chat-entry ${state.chatOpen ? "on" : ""}" data-chat-toggle title="问小A同学" aria-label="问小A同学" aria-pressed="${state.chatOpen}">${ICON.chat} 问小A同学</button>
        </div>
      </div>
      <div class="meta">
        <select class="select" data-status="${it.id}" aria-label="状态">
          ${STATUS_ORDER.map((s) => `<option value="${s}" ${it.status === s ? "selected" : ""}>${statusLabel(s)}</option>`).join("")}
        </select>
        <span class="prio">${esc(it.priority || "P2")}</span>
        <span>负责人 ${esc(it.owner || "—")}</span>
        ${it.waiver ? `<span class="chip waiver" title="${esc(it.waiver.reason)}">已豁免</span>` : ""}
      </div>
      <div class="impl">
        <span class="label">助手</span>
        ${sup ? `${avatar(sup)}<span class="who">${esc(sup.name)}</span>` : `<span class="who" style="color:var(--faint)">未指派</span>`}
        <span class="sep">·</span>
        <span class="label">实现</span>
        ${impl.length
          ? `${avatarStack(impl, 3)}<span class="who">${impl.map((b) => esc(b.name)).join(" / ")}</span><span class="count">${stats.done}/${stats.total} 任务</span>`
          : isDelivery(it)
            ? (it.status === "draft" || it.status === "reviewing"
              ? `<span class="who" style="color:var(--faint)">批准后派活</span>`
              : `<span class="who" style="color:var(--amber)">未派活</span>`)
            : `<span class="who" style="color:var(--faint)">${childrenOf(it).length ? "子项未派活" : "未派活"}</span>`}
        ${!isDelivery(it) && tasks.length ? `<span class="count">汇总自子项</span>` : ""}
        <span class="spacer"></span>
        ${isDelivery(it) ? `<button class="btn tiny" data-assign="${it.id}" ${it.status === "draft" || it.status === "reviewing" ? 'disabled title="批准后才能派活"' : ""}>${ICON.bot} 派活</button>` : ""}
      </div>
      ${state.gateError && state.gateError.id === it.id ? `<div class="gate">${esc(state.gateError.text)}<button data-fix-gate="${it.id}">去补</button></div>` : ""}
      <div class="md">${esc(it.body || "（暂无正文）")}</div>
      ${levelFieldsHtml(it)}
      ${(it.level === "sr" || it.level === "us") ? secHtml(it, "acc", "验收判据", (it.acceptance || []).length, acceptanceHtml(it, accNeeds)) : ""}
      ${secHtml(it, "children", "子需求", childrenOf(it).length, childrenHtml(it))}
      ${secHtml(it, "links", "关联", (it.links || []).length, linksHtml(it))}
      ${secHtml(it, "tasks", "任务", tasks.length + collectVerifyTasks(it).length, tasksHtml(it))}
      ${secHtml(it, "timeline", "时间线", (it.events || []).length, timelineHtml(it))}
    `;
  }

  function levelFieldsHtml(it) {
    if (it.level === "rr") {
      return `<div class="kv"><span class="k">提出人</span><span class="box">${esc(it.requester || "—")}</span></div>
        <div class="kv"><span class="k">来源</span><span class="box">${esc(it.source || "—")} · 原话保留在正文</span></div>`;
    }
    if (it.level === "ir") {
      return `<div class="kv"><span class="k">范围</span><span class="box">${esc(it.scope || "—")}</span></div>
        <div class="kv"><span class="k">范围外</span><span class="box">${esc(it.outOfScope || "—")}</span></div>`;
    }
    if (it.level === "sr") {
      return `<div class="kv"><span class="k">影响模块</span><span class="box">${esc(it.impact || "—")}</span></div>`;
    }
    return `<div class="kv"><span class="k">角色 / 价值</span><span class="box">${esc(it.role || "—")} · ${esc(it.value || "—")}</span></div>`;
  }

  function secHtml(it, name, title, count, body) {
    const key = `${it.id}:${name}`;
    const open = !state.collapsed.has(key);
    return `<section class="sec" data-section="${name}">
      <div class="sec-head"><h3>${title}</h3><span class="count">${count}</span>
        <button class="chev ${open ? "open" : ""}" data-sec="${key}" title="${open ? "收起" : "展开"}" aria-label="${open ? "收起" : "展开"}" aria-expanded="${open}">${ICON.chev}</button>
      </div>
      ${open ? body : ""}
    </section>`;
  }

  function acceptanceHtml(it, needs) {
    const rows = (it.acceptance || []).map((a, i) => `
      <div class="acc-row ${a.done ? "done" : ""} ${needs && !a.done ? "needs" : ""}">
        <input type="checkbox" ${a.done ? "checked" : ""} data-acc="${it.id}:${i}" aria-label="验收判据 ${i + 1}" />
        <span>${esc(a.text)}</span>
      </div>`).join("");
    return `${rows || `<div class="inline-empty">还没有验收判据。批准 / 完成前至少要有一条。<button class="link" data-chat-ask="acceptance">问小A同学补一条</button></div>`}
      <input class="inline-add" data-accept-input placeholder="输入一条可判定的验收，回车添加" aria-label="添加验收判据" />`;
  }

  function childrenHtml(it) {
    const next = nextLevel(it.level);
    if (!next) return `<div class="inline-empty">这是当前裁剪下的交付层，没有下游需求。</div>`;
    const kids = childrenOf(it);
    const rows = kids.map((c) => `
      <div class="child-row" data-select="${c.id}">
        ${dot(c.status)}<span class="key">${shortKey(c.key)}</span><span class="ttl">${esc(c.title)}</span>
        <span class="row-end">${isDelivery(c) ? avatarStack(implementers(c)) : ""}${gapChip(c)}</span>
      </div>`).join("");
    const creating = state.creating?.context === "detail" && state.creating.parentId === it.id;
    return `${rows || `<div class="inline-empty">还没有 ${levelName(next)}。</div>`}
      ${creating ? createRowHtml("detail", next, it.id, true) : `<button class="btn tiny" data-create-child="${it.id}">${ICON.plus} 新建 ${levelName(next)}</button>`}`;
  }

  function linksHtml(it) {
    const links = (it.links || []).map((l) => {
      const target = byId(l.toId);
      if (!target) return "";
      return `<div class="child-row" data-select="${target.id}">${dot(target.status)}<span class="key">${shortKey(target.key)}</span><span class="ttl">${esc(target.title)}</span><span class="row-end"><span class="chip">${esc(l.kind)}</span></span></div>`;
    }).join("");
    return links || `<div class="inline-empty">没有横向关联。父子关系在「子需求」里。</div>`;
  }

  function tasksHtml(it) {
    const list = [...collectDeliverTasks(it), ...collectVerifyTasks(it)];
    if (!list.length) {
      const hint = !isDelivery(it)
        ? "只有交付层能派活；先把需求拆到交付层。"
        : it.status === "draft" || it.status === "reviewing"
          ? "批准后才能派活。"
          : "没有任务。可以点「派活」建一条。";
      return `<div class="inline-empty">${hint}</div>`;
    }
    return list.map((t) => {
      const b = state.bots.find((x) => x.id === t.botId);
      const src = byId(t.reqId);
      return `<div class="task-row">${avatar(b)}<span class="chip">${t.kind === "verify" ? "验收" : "实现"}</span>${src && src.id !== it.id ? `<span class="key">${shortKey(src.key)}</span>` : ""}<span class="task-title">${esc(t.title)}</span><span class="task-meta"><span>${t.key}</span><span>${t.status === "running" ? "运行中" : t.status === "done" ? "完成" : t.status === "cancelled" ? "已停止" : "待开跑"}</span></span></div>`;
    }).join("");
  }

  function timelineHtml(it) {
    const list = [...(it.events || [])].sort((a, b) => b.at - a.at);
    if (!list.length) return `<div class="inline-empty">还没有事件。</div>`;
    return `<div class="tl">${list.map((e) => `<div class="tl-item"><span class="tl-time">${fmt(e.at)}</span><span>${esc(e.text)}</span></div>`).join("")}</div>`;
  }

  // ── board ──────────────────────────────────────────────────────────
  function boardHtml() {
    const lv = enabled().includes(state.boardLevel) ? state.boardLevel : deliveryLevel();
    let list = visibleItems().filter((i) => i.level === lv);
    if (state.boardBot === "none") list = list.filter((i) => collectDeliverTasks(i).length === 0);
    else if (state.boardBot !== "all") list = list.filter((i) => collectDeliverTasks(i).some((t) => t.botId === state.boardBot));
    if (state.boardGapOnly) list = list.filter((i) => gapOf(i));
    const cols = BOARD_COLS.map((s) => ({ s, items: list.filter((i) => i.status === s).sort((a, b) => a.seq - b.seq) }));
    return `<section class="panel">
      <div class="view-tools">
        <select class="select" data-board-level aria-label="看板层级">
          ${enabled().map((l) => `<option value="${l}" ${l === lv ? "selected" : ""}>${levelName(l)}</option>`).join("")}
        </select>
        <select class="select" data-board-bot aria-label="按实现者筛选">
          <option value="all" ${state.boardBot === "all" ? "selected" : ""}>全部实现者</option>
          <option value="none" ${state.boardBot === "none" ? "selected" : ""}>未派活</option>
          ${state.bots.map((b) => `<option value="${b.id}" ${state.boardBot === b.id ? "selected" : ""}>${esc(b.name)}</option>`).join("")}
        </select>
        <label class="check"><input type="checkbox" data-board-gap ${state.boardGapOnly ? "checked" : ""} /> 只看缺口</label>
        <span class="spacer"></span>
        <span class="view-note">M2 静态帧：拖拽与闸门未实现</span>
      </div>
      <div class="board-wrap">
        ${cols.map((c) => `
          <div class="board-col">
            <div class="board-col-head">${dot(c.s)} ${statusLabel(c.s)}<span class="n">${c.items.length}</span></div>
            <div class="board-cards">
              ${c.items.map(boardCard).join("") || `<div class="inline-empty">—</div>`}
            </div>
          </div>`).join("")}
      </div>
    </section>`;
  }
  function boardCard(it) {
    const impl = implementers(it);
    const stats = taskStats(it);
    return `<article class="card" data-open-drawer="${it.id}" title="打开详情">
      <div class="card-key">${shortKey(it.key)} ${it.ai ? `<span class="chip ai">AI</span>` : ""}</div>
      <div class="card-title">${esc(it.title)}</div>
      <div class="card-foot">
        ${impl.length
          ? `${avatarStack(impl)}<span>${stats.done}/${stats.total}</span>`
          : isDelivery(it) && ["approved", "in_progress", "verifying"].includes(it.status)
            ? `<span class="unassigned">未派活</span>` : `<span>—</span>`}
        <span class="spacer"></span>
        ${gapOf(it) && !(gapOf(it).type === "unplanned" && !impl.length) ? `<span class="chip gap">${gapOf(it).label}</span>` : ""}
        ${(it.acceptance || []).length ? `<span>${(it.acceptance || []).length} 验收</span>` : ""}
      </div>
    </article>`;
  }

  // ── gantt ──────────────────────────────────────────────────────────
  function ganttHtml() {
    const lv = deliveryLevel();
    const list = visibleItems().filter((i) => i.level === lv);
    const scheduled = list.filter((i) => i.planStart && i.planEnd);
    const unscheduled = list.filter((i) => !i.planStart || !i.planEnd);
    const rangeStart = startOfDay(NOW - 3 * DAY);
    const days = 14;
    const headers = Array.from({ length: days }, (_, i) => {
      const d = rangeStart + i * DAY;
      return `<div class="gantt-day">${i % 2 === 0 ? fmtDay(d) : ""}</div>`;
    }).join("");
    const groups = new Map();
    for (const it of scheduled) {
      const root = ancestors(it)[0] || it;
      if (!groups.has(root.id)) groups.set(root.id, { root, list: [] });
      groups.get(root.id).list.push(it);
    }
    const todayPct = ((startOfDay(NOW) - rangeStart) / DAY) / days * 100;
    const body = [...groups.values()].map((g) => `
      <div class="gantt-group"><div class="left">${dot(g.root.status)}<span class="key">${shortKey(g.root.key)}</span><span class="ttl">${esc(g.root.title)}</span></div><div class="right"></div></div>
      ${g.list.sort((a, b) => a.seq - b.seq).map((it) => {
        const s = Math.max(startOfDay(it.planStart), rangeStart);
        const e = Math.min(startOfDay(it.planEnd) + DAY, rangeStart + days * DAY);
        const left = Math.max(0, (s - rangeStart) / DAY / days * 100);
        const width = Math.max(2, (e - s) / DAY / days * 100);
        const impl = implementers(it);
        return `<div class="gantt-row">
          <div class="gantt-left" data-open-drawer="${it.id}">${dot(it.status)}${impl.length ? avatarStack(impl, 1) : ""}<span class="key">${shortKey(it.key)}</span><span class="ttl">${esc(it.title)}</span></div>
          <div class="gantt-track"><div class="today-line" style="left:${todayPct}%"></div><div class="bar ${it.status}" style="left:${left}%;width:${width}%"></div></div>
        </div>`;
      }).join("")}`).join("");
    return `<section class="panel">
      <div class="view-tools">
        <span class="view-note">M3 静态帧：日期 / 依赖 / 拖拽未实现</span>
        <span class="spacer"></span>
        <span class="view-note">今天 ${fmtDay(NOW)}</span>
      </div>
      <div class="gantt-wrap">
        ${scheduled.length ? `<div class="gantt">
          <div class="gantt-head"><div class="left">需求</div><div class="gantt-days">${headers}</div></div>
          ${body}
        </div>` : `<div class="empty"><h3>还没有排期</h3><div>给交付层设置起止日期后，这里才会出现时间线。</div></div>`}
        <div class="unscheduled">
          <h4>未排期 ${unscheduled.length}</h4>
          ${unscheduled.map((it) => `<div class="u-row" data-open-drawer="${it.id}">${dot(it.status)}<span class="key">${shortKey(it.key)}</span><span class="ttl">${esc(it.title)}</span><span class="spacer" style="flex:1"></span><span class="chip">未排期</span></div>`).join("") || `<div class="inline-empty">全部已排期。</div>`}
        </div>
      </div>
    </section>`;
  }

  // ── matrix ────────────────────────────────────────────────────────
  function buildPaths() {
    const out = [];
    const walk = (it, chain) => {
      const next = nextLevel(it.level);
      const kids = childrenOf(it);
      if (!next || !kids.length) { out.push([...chain, it]); return; }
      for (const k of kids) walk(k, [...chain, it]);
    };
    for (const r of roots()) walk(r, []);
    return out;
  }
  function pathHasGap(path) {
    for (const lv of enabled().slice(1)) {
      const idx = enabled().indexOf(lv);
      const found = path.find((i) => i.level === lv);
      if (found) continue;
      const prev = [...path].reverse().find((i) => enabled().indexOf(i.level) < idx);
      if (prev && enabled().indexOf(prev.level) === idx - 1 && prev.waiver && prev.waiver.forLevel === lv) continue;
      return true;
    }
    return false;
  }
  function matrixHtml() {
    const paths = buildPaths();
    const shown = state.matrixGapOnly ? paths.filter(pathHasGap) : paths;
    const groups = new Map();
    for (const p of shown) {
      const root = p[0];
      if (!groups.has(root.id)) groups.set(root.id, { root, paths: [] });
      groups.get(root.id).paths.push(p);
    }
    const cols = enabled().slice(1);
    return `<section class="panel">
      <div class="view-tools">
        <label class="check"><input type="checkbox" data-matrix-gap ${state.matrixGapOnly ? "checked" : ""} /> 只看缺口</label>
        <div class="legend"><span><b>✓</b> 已批准</span><span><b>○</b> 进行中</span><span><b>—</b> 缺</span><span><b>已豁免</b> 有理由不补</span></div>
        <span class="spacer"></span>
        <span class="view-note">行 = 一条需求链；分支缺口单独成行</span>
      </div>
      <div class="matrix-wrap">
        ${shown.length ? `<table class="matrix">
          <thead><tr>${cols.map((lv) => `<th>${levelName(lv)}</th>`).join("")}</tr></thead>
          <tbody>
            ${[...groups.values()].map((g) => `
              <tr class="group"><td colspan="${cols.length}"><span class="group-key">${shortKey(g.root.key)}</span>${esc(g.root.title)} ${dot(g.root.status)} ${gapChip(g.root)}</td></tr>
              ${g.paths.map((p) => `<tr>${cols.map((lv) => matrixCell(p, lv)).join("")}</tr>`).join("")}
            `).join("")}
          </tbody>
        </table>` : `<div class="empty"><h3>没有要看的链路</h3><div>${state.matrixGapOnly ? "当前没有缺口。" : "先在需求池建一条 RR。"}</div></div>`}
      </div>
    </section>`;
  }
  function matrixCell(path, lv) {
    const it = path.find((i) => i.level === lv);
    if (it) {
      return `<td><button class="mx-chip" data-open-drawer="${it.id}" title="${esc(it.title)} · ${statusLabel(it.status)}">
        ${dot(it.status)}<span class="key">${shortKey(it.key)}</span><span class="ttl">${esc(it.title)}</span>
        ${gapOf(it) ? `<span class="chip gap">${gapOf(it).label}</span>` : ""}
      </button></td>`;
    }
    const idx = enabled().indexOf(lv);
    const prev = [...path].reverse().find((i) => enabled().indexOf(i.level) < idx);
    const immediate = prev && enabled().indexOf(prev.level) === idx - 1;
    if (immediate && prev.waiver && prev.waiver.forLevel === lv) {
      return `<td><span class="mx-waiver" title="${esc(prev.waiver.reason)}">已豁免</span></td>`;
    }
    if (immediate && state.creating?.context === "matrix" && state.creating.level === lv && state.creating.parentId === prev.id) {
      return `<td><input class="mx-input" data-create-input placeholder="标题，回车创建" value="${esc(state.creating.title || "")}" aria-label="新建 ${levelName(lv)}" /></td>`;
    }
    if (immediate) {
      return `<td><button class="mx-add" data-matrix-add="${lv}" data-parent="${prev.id}" title="在 ${shortKey(prev.key)} 下新建 ${levelName(lv)}">${ICON.plus} 新建</button></td>`;
    }
    return `<td><span class="mx-miss" title="先补上一级">—</span></td>`;
  }

  // ── drawers ───────────────────────────────────────────────────────
  function renderDrawer() {
    const root = document.getElementById("drawerRoot");
    const d = state.drawer;
    if (!d) { root.innerHTML = ""; return; }
    let html = "";
    if (d.type === "detail") {
      const it = byId(d.id);
      if (!it) { state.drawer = null; root.innerHTML = ""; return; }
      html = `<aside class="drawer wide">
        <div class="drawer-head"><span class="t">${esc(it.title)}</span><span class="sub">${shortKey(it.key)}</span><span class="spacer"></span><button class="icon-btn" data-close-drawer title="关闭" aria-label="关闭">${ICON.close}</button></div>
        <div class="drawer-body no-pad"><div class="detail-scroll">${detailHtml(it)}</div></div>
      </aside>`;
    } else if (d.type === "tailor") {
      html = tailorDrawer();
    } else if (d.type === "assign") {
      html = assignDrawer();
    }
    root.innerHTML = `<div class="scrim" data-close-drawer></div>${html}`;
  }

  function tailorDrawer() {
    const draft = state.tailoringDraft || [...enabled()];
    const tpl = templateOf(draft);
    const impact = [];
    for (const lv of enabled()) {
      if (!draft.includes(lv) && lv !== "rr") {
        const n = state.items.filter((i) => i.level === lv && enabled().includes(i.level)).length;
        const r = reparentCount(lv);
        impact.push(`关掉 ${levelName(lv)}：<b>${n}</b> 条需求隐藏，<b>${r}</b> 条子需求上挂到 ${draft.includes(prevLevel(lv)) ? levelName(prevLevel(lv)) : levelName(draft.filter((x) => LEVELS.indexOf(x) < LEVELS.indexOf(lv)).pop() || "rr")}`);
      }
    }
    return `<aside class="drawer">
      <div class="drawer-head"><span class="t">裁剪与字段</span><span class="sub">${esc(state.project.alias)}</span><span class="spacer"></span><button class="icon-btn" data-close-drawer title="关闭" aria-label="关闭">${ICON.close}</button></div>
      <div class="drawer-body">
        <div class="field"><label>模板</label>
          ${[["light", "轻量", "RR → US"], ["standard", "标准", "RR → SR → US"], ["full", "完整", "RR → IR → SR → US"], ["custom", "自定义", "按下面开关"]].map(([k, name, desc]) => `
            <div class="radio-row ${tpl === k ? "on" : ""}" data-template="${k}">
              <span class="mark"></span><span>${name}</span><span class="meta">${desc}</span>
            </div>`).join("")}
        </div>
        <div class="field"><label>层级</label>
          ${LEVELS.map((lv) => `<div class="level-row">
            <span class="lv">${levelName(lv)}</span><span class="name">${LV[lv].label}</span>
            ${lv === "rr" ? `<span class="locked">固定开启</span>` : `<label class="check" style="margin-left:auto"><input type="checkbox" data-toggle-level="${lv}" ${draft.includes(lv) ? "checked" : ""} /> 启用</label>`}
          </div>`).join("")}
          <div class="chain">${draft.map((lv) => `<b>${levelName(lv)}</b>`).join("<span>→</span>")}</div>
          ${draft.length < 2 ? `<div class="warn-note">至少保留 2 层。</div>` : ""}
        </div>
        ${impact.length ? `<div class="impact">${impact.join("<br>")}<br><span style="opacity:.8">关层不会删除数据；重新开启会恢复原位。</span></div>` : `<div class="note">当前层级没有被关闭。</div>`}
        <div class="gates">
          ${draft.map((lv) => `<div class="gate-row"><span class="lv">${levelName(lv)}</span><span class="tag">${lv === "rr" || lv === "ir" ? "需评审" : "不评审"}</span><span class="tag">${lv === "sr" || lv === "us" ? "验收 ≥1" : "无验收"}</span></div>`).join("")}
        </div>
        <div class="note">原型说明：模板 / 层开关会即时改变树、看板、计划与矩阵；字段闸门只做了验收与派活两条。</div>
      </div>
      <div class="drawer-foot"><button class="btn" data-close-drawer>取消</button><button class="btn primary" data-save-tailor ${draft.length < 2 ? "disabled" : ""}>保存</button></div>
    </aside>`;
  }

  function assignDrawer() {
    const a = state.assign;
    const it = a ? byId(a.id) : null;
    if (!a || !it) return "";
    return `<aside class="drawer">
      <div class="drawer-head"><span class="t">派活</span><span class="sub">${shortKey(it.key)}</span><span class="spacer"></span><button class="icon-btn" data-close-drawer title="关闭" aria-label="关闭">${ICON.close}</button></div>
      <div class="drawer-body">
        <div class="field"><label>给谁</label>
          ${state.bots.map((b) => `<div class="bot-row ${a.botId === b.id ? "on" : ""}" data-assign-bot="${b.id}">
            ${avatar(b, true)}<span>${esc(b.name)}</span><span class="role">${b.role === "supervisor" ? "全局助手 · 拆解" : "员工"}</span>
            <span class="load">${collectDeliverTasks(it).filter((t) => t.botId === b.id).length} 个任务</span>
          </div>`).join("")}
        </div>
        <div class="field"><label>工作区</label>
          <select class="select" data-assign-workspace>
            <option value="project" ${a.workspace === "project" ? "selected" : ""}>项目根 · ${esc(state.project.name)}</option>
            <option value="worktree" ${a.workspace === "worktree" ? "selected" : ""}>新建 worktree</option>
            <option value="existing" ${a.workspace === "existing" ? "selected" : ""}>${esc((state.bots.find((b) => b.id === a.botId) || {}).name || "Bot")} 已有工作区</option>
          </select>
        </div>
        <div class="field"><label>任务标题</label><input class="input" data-assign-title value="${esc(a.title)}" /></div>
        <div class="field"><label>验收（跟随需求）</label>
          <div class="ai-preview">${(it.acceptance || []).map((x) => `<div class="line"><span>·</span><span>${esc(x.text)}</span></div>`).join("") || `<span style="color:var(--amber)">还没有验收判据；派活后仍然不能批准。</span>`}</div>
        </div>
        <label class="check" style="margin-top:4px"><input type="checkbox" data-assign-run ${a.runNow ? "checked" : ""} /> 建完立即开跑（默认只建任务，由 Bot 自己领）</label>
        <div class="note">需求上不存「负责 Bot」；实现者是下面这条 deliver 任务上 botId 的聚合。改派只改任务。</div>
      </div>
      <div class="drawer-foot"><button class="btn" data-close-drawer>取消</button><button class="btn primary" data-assign-confirm>派活</button></div>
    </aside>`;
  }

  function renderToast() {
    const root = document.getElementById("toastRoot");
    if (!state.toast) { root.innerHTML = ""; return; }
    root.innerHTML = `<div class="toast"><span>${esc(state.toast.text)}</span>${state.toast.undo ? `<button data-undo>撤销</button>` : ""}</div>`;
  }
  function toast(text, undo) {
    state.toast = { text, undo: !!undo };
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { state.toast = null; renderToast(); }, 4200);
    renderToast();
  }

  function renderMenu() {
    const menu = document.getElementById("pageMenu");
    if (menu) menu.hidden = !state.menuOpen;
  }

  function focusPending() {
    const sel = state.focus;
    state.focus = null;
    if (!sel) return;
    requestAnimationFrame(() => {
      const list = document.querySelectorAll(sel);
      const el = list[list.length - 1];
      if (!el) return;
      el.focus();
      if (el.setSelectionRange && typeof el.value === "string") el.setSelectionRange(el.value.length, el.value.length);
    });
  }

  // ── events ────────────────────────────────────────────────────────
  document.addEventListener("click", (e) => {
    const t = e.target;

    const close = t.closest("[data-close-drawer]");
    if (close) { state.drawer = null; state.assign = null; render(); return; }

    const cheat = t.closest("[data-expand]");
    if (cheat) {
      const id = cheat.getAttribute("data-expand");
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      render();
      return;
    }

    const tab = t.closest("[data-tab]");
    if (tab) { state.tab = tab.getAttribute("data-tab"); state.drawer = null; render(); return; }

    const menuBtn = t.closest('[data-action="menu"]');
    if (menuBtn) { state.menuOpen = !state.menuOpen; renderMenu(); return; }
    if (!t.closest(".menu-wrap")) state.menuOpen = false;
    renderMenu();

    const mi = t.closest("[data-menu]");
    if (mi) {
      state.menuOpen = false;
      const what = mi.getAttribute("data-menu");
      if (what === "tailor") openTailor();
      else if (what === "export") toast("原型：已生成 Markdown（不落盘）");
      else if (what === "check") toast("数据自检：0 处断链（原型）");
      return;
    }

    const act = t.closest("[data-action]");
    if (act) {
      const what = act.getAttribute("data-action");
      if (what === "new") openCreate();
      else if (what === "assistant-home") { state.chatMode = "home"; state.chatOpen = true; state.chatAutoScroll = true; render(); }
      else if (what === "theme") {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("cmh.proto.theme", next); } catch {}
      }
      return;
    }

    const sel = t.closest("[data-select]");
    if (sel) {
      const id = sel.getAttribute("data-select");
      if (state.selectedId !== id) { state.selectedId = id; state.resetDetail = true; state.chatAutoScroll = true; state.mandateDraft = false; }
      state.drawer = null;
      state.gateError = null;
      render();
      return;
    }

    const chatToggle = t.closest("[data-chat-toggle]");
    if (chatToggle) {
      const fromDrawer = !!t.closest(".drawer");
      if (fromDrawer) state.drawer = null;
      state.chatMode = "requirement";
      state.chatOpen = !state.chatOpen || fromDrawer;
      state.chatAutoScroll = true;
      render();
      return;
    }

    const chatClose = t.closest("[data-chat-close]");
    if (chatClose) { state.chatOpen = false; render(); return; }

    const chatStop = t.closest("[data-chat-stop]");
    if (chatStop) { stopStream(); return; }

    const chatNew = t.closest("[data-chat-new]");
    if (chatNew) {
      if (state.chatMode === "home") state.homeChat = [];
      else { const it = byId(state.selectedId); if (it) delete state.chats[it.id]; }
      state.chatDraft = "";
      render();
      return;
    }

    const copyMsg = t.closest("[data-copy-msg]");
    if (copyMsg) {
      const it = byId(state.selectedId);
      const msgs = state.chatMode === "home" ? state.homeChat : (it ? ensureChat(it) : []);
      const m = msgs.find((x) => x.id === copyMsg.getAttribute("data-copy-msg"));
      if (m?.text) { navigator.clipboard?.writeText(m.text).catch(() => {}); toast("已复制"); }
      return;
    }

    const retryMsg = t.closest("[data-retry-msg]");
    if (retryMsg) { retryMessage(retryMsg.getAttribute("data-retry-msg")); return; }

    const chatAsk = t.closest("[data-chat-ask]");
    if (chatAsk) { askChat(chatAsk.getAttribute("data-chat-ask")); return; }

    const chatQuick = t.closest("[data-chat-quick]");
    if (chatQuick) { const k = chatQuick.getAttribute("data-chat-quick"); if (state.chatMode === "home") askHome(k); else askChat(k); return; }

    const chatSend = t.closest("[data-chat-send]");
    if (chatSend) { if (state.chatMode === "home") sendHomeChat(state.chatDraft); else sendChat(state.chatDraft); return; }

    const helpOpen = t.closest("[data-help-open]");
    if (helpOpen) { const target = helpOpen.getAttribute("data-help-open"); navigateTo(target, target === "pool" ? "new" : null); return; }

    const pathStep = t.closest("[data-path-target]");
    if (pathStep) { focusTarget(pathStep.getAttribute("data-path-target")); return; }

    const homeGo = t.closest("[data-home-go]");
    if (homeGo) { navigateTo(homeGo.getAttribute("data-home-go")); return; }

    const resultSelect = t.closest("[data-result-select]");
    if (resultSelect) {
      state.selectedId = resultSelect.getAttribute("data-result-select");
      state.tab = "pool";
      state.chatMode = "requirement";
      state.chatOpen = true;
      state.resetDetail = true;
      state.chatAutoScroll = true;
      const focus = resultSelect.getAttribute("data-focus");
      render();
      if (focus) setTimeout(() => focusTarget(focus), 90);
      return;
    }

    const propApply = t.closest("[data-prop-apply]");
    if (propApply) { applyProposal(propApply.getAttribute("data-prop-apply")); return; }

    const propDismiss = t.closest("[data-prop-dismiss]");
    if (propDismiss) { dismissProposal(propDismiss.getAttribute("data-prop-dismiss")); return; }

    const mandateRevoke = t.closest("[data-mandate-revoke]");
    if (mandateRevoke) {
      const it = byId(state.selectedId);
      if (it) state.mandate[it.id] = {};
      toast("已撤销本会话授权");
      render();
      return;
    }

    const open = t.closest("[data-open-drawer]");
    if (open) { state.drawer = { type: "detail", id: open.getAttribute("data-open-drawer") }; render(); return; }

    const assign = t.closest("[data-assign]");
    if (assign) { openAssign(assign.getAttribute("data-assign"), t.closest(".drawer") ? "detail" : "pool"); return; }

    const sec = t.closest("[data-sec]");
    if (sec) {
      const key = sec.getAttribute("data-sec");
      if (state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
      render();
      return;
    }

    const child = t.closest("[data-create-child]");
    if (child) {
      const it = byId(child.getAttribute("data-create-child"));
      if (!it) return;
      const next = nextLevel(it.level);
      if (!next) return;
      state.creating = { context: "detail", level: next, parentId: it.id, title: "" };
      state.focus = "[data-create-input]";
      render();
      return;
    }

    const mx = t.closest("[data-matrix-add]");
    if (mx) {
      state.creating = { context: "matrix", level: mx.getAttribute("data-matrix-add"), parentId: mx.getAttribute("data-parent"), title: "" };
      state.focus = "[data-create-input]";
      render();
      return;
    }

    const fix = t.closest("[data-fix-gate]");
    if (fix) {
      const id = fix.getAttribute("data-fix-gate");
      const ge = state.gateError;
      if (ge && ge.key === "tasks") { openAssign(id, "pool"); return; }
      if (ge && ge.key === "acceptance") { state.focus = "[data-accept-input]"; render(); return; }
      toast("该字段在原型里只读；实现时会聚焦到对应输入");
      return;
    }

    const tpl = t.closest("[data-template]");
    if (tpl) { setTemplate(tpl.getAttribute("data-template")); return; }

    const bot = t.closest("[data-assign-bot]");
    if (bot) { state.assign.botId = bot.getAttribute("data-assign-bot"); render(); return; }

    const confirm = t.closest("[data-assign-confirm]");
    if (confirm) { confirmAssign(); return; }

    const save = t.closest("[data-save-tailor]");
    if (save) { saveTailor(); return; }

    const undo = t.closest("[data-undo]");
    if (undo) { undoLast(); return; }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("[data-status]")) { setStatus(t.getAttribute("data-status"), t.value); return; }
    if (t.matches("[data-filter-level]")) { state.filters.level = t.value; render(); return; }
    if (t.matches("[data-filter-status]")) { state.filters.status = t.value; render(); return; }
    if (t.matches("[data-board-level]")) { state.boardLevel = t.value; render(); return; }
    if (t.matches("[data-board-bot]")) { state.boardBot = t.value; render(); return; }
    if (t.matches("[data-board-gap]")) { state.boardGapOnly = t.checked; render(); return; }
    if (t.matches("[data-matrix-gap]")) { state.matrixGapOnly = t.checked; render(); return; }
    if (t.matches("[data-create-level]")) {
      if (!state.creating) return;
      state.creating.level = t.value;
      state.creating.parentId = parentForLevel(t.value, state.creating.parentId || state.selectedId);
      state.focus = "[data-create-input]";
      render();
      return;
    }
    if (t.matches("[data-acc]")) {
      const [id, idx] = t.getAttribute("data-acc").split(":");
      const it = byId(id);
      if (it && it.acceptance[idx]) { it.acceptance[idx].done = t.checked; render(); }
      return;
    }
    if (t.matches("[data-assign-workspace]")) { state.assign.workspace = t.value; render(); return; }
    if (t.matches("[data-assign-run]")) { state.assign.runNow = t.checked; return; }
    if (t.matches("[data-toggle-level]")) { toggleLevel(t.getAttribute("data-toggle-level")); return; }
    if (t.matches("[data-mandate-session]")) { state.mandateDraft = t.checked; return; }
    if (t.matches("[data-prop-check]")) {
      const [mid, idx] = t.getAttribute("data-prop-check").split(":");
      const it = byId(state.selectedId);
      if (!it) return;
      const m = ensureChat(it).find((x) => x.id === mid);
      if (m && m.proposal && m.proposal.items[idx]) m.proposal.items[idx].checked = t.checked;
      return;
    }
    if (t.matches("[data-dispatch-run]")) {
      const [mid, idx] = t.getAttribute("data-dispatch-run").split(":");
      const it = byId(state.selectedId);
      if (!it) return;
      const m = ensureChat(it).find((x) => x.id === mid);
      if (m && m.proposal && m.proposal.items[idx]) { m.proposal.items[idx].runNow = t.checked; render(); }
      return;
    }
    if (t.matches("#projectSelect")) { t.selectedIndex = 0; toast("原型只有一个项目；实现时这里切项目 = 换整棵树"); return; }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.matches("[data-search]")) {
      state.filters.query = t.value;
      state.focus = "[data-search]";
      render();
      return;
    }
    if (t.matches("[data-create-input]") && state.creating) { state.creating.title = t.value; return; }
    if (t.matches("[data-assign-title]") && state.assign) { state.assign.title = t.value; return; }
    if (t.matches("[data-chat-input]")) { state.chatDraft = t.value; return; }
  });

  document.addEventListener("keydown", (e) => {
    const t = e.target;
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "a") {
      e.preventDefault();
      state.chatOpen = !state.chatOpen;
      if (state.chatOpen) state.chatMode = state.selectedId ? "requirement" : "home";
      state.chatAutoScroll = true;
      render();
      return;
    }

    if (t.matches("[data-create-input]")) {
      if (e.key === "Enter") { e.preventDefault(); createFromState(t); return; }
      if (e.key === "Escape") { e.preventDefault(); cancelCreate(); return; }
    }
    if (t.matches("[data-chat-input]")) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (state.chatMode === "home") sendHomeChat(t.value); else sendChat(t.value); return; }
      if (e.key === "Enter" && e.shiftKey) return;
    }
    if (t.matches("[data-accept-input]")) {
      if (e.key === "Enter") {
        e.preventDefault();
        const v = t.value.trim();
        if (!v) return;
        const it = byId(state.selectedId);
        if (!it) return;
        it.acceptance.push({ text: v, done: false });
        it.events.push({ at: Date.now(), text: "新增验收判据" });
        state.gateError = null;
        t.value = "";
        state.focus = "[data-accept-input]";
        render();
        return;
      }
    }
    if (e.key === "Escape") {
      if (state.creating) { cancelCreate(); return; }
      if (state.drawer) { state.drawer = null; state.assign = null; render(); return; }
      if (state.menuOpen) { state.menuOpen = false; renderMenu(); return; }
    }
    if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && e.key === "c") {
      e.preventDefault();
      openCreate();
    }
  });

  // init theme
  try {
    const q = new URLSearchParams(location.search);
    const saved = q.get("theme") || localStorage.getItem("cmh.proto.theme");
    if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  } catch {}
  render();
})();
</script>
</body>
</html>
