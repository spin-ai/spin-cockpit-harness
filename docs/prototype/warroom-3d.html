<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作战室 · 3D 指挥中心 spike</title>
<!--
  作战室 3D spike（独立文件，不影响 warroom.html）
  ────────────────────────────────────────────────────────────
  目的：验证「整个舞台用 three.js 做 3D」值不值得，而不是只换掉那颗地球。
  内容：透视房间 + 视频墙（HUD 贴图 + 3D 地球）+ 操作台 + 值班席 + 灯光。
  约定：
  - 中文 UI / 文案全部留在 DOM 与 CanvasTexture，不用 WebGL 画字；
  - 亮暗两套只换调色板与灯光，几何不变；
  - 动效只保留地球自转 / 轨道 / 屏幕扫光，尊重 prefers-reduced-motion。
  依赖：vendor/three.min.js（r149，MIT），classic script，可双击离线打开。
  参数：?theme=light|dark 定格主题；拖动 / 移动鼠标做视角偏移，双击复位。
-->
<style>
:root{
  --font-sans:"Geist Variable","Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono Variable","Geist Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,monospace;
  --bg:#070a0d;--fg:#e9f1f5;--fg-2:#b9c8d1;--muted:#7f909b;--faint:#5b6a74;
  --line:rgba(255,255,255,.10);--glow:#6fd6f5;--panel:rgba(10,14,18,.72);
}
:root[data-theme="light"]{
  --bg:#dfe7ee;--fg:#0a0d10;--fg-2:#33414c;--muted:#5b6874;--faint:#7d8994;
  --line:rgba(10,14,18,.12);--glow:#2f9fc4;--panel:rgba(250,252,254,.78);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s}
.page{height:100%;display:flex;flex-direction:column;gap:0}
.head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:14px 20px 10px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;display:flex;align-items:center;gap:8px}
.tag{font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--glow);border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);border-radius:4px;padding:2px 6px}
.sub{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:760px}
.actions{display:flex;align-items:center;gap:6px;flex:none}
.btn{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--fg-2);font-size:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;text-decoration:none}
.btn:hover{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.btn.on{background:var(--glow);border-color:var(--glow);color:#04121a}
.stage{position:relative;flex:1;min-height:0;margin:0 16px 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#05080b}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{flex:none;display:flex;align-items:center;gap:14px;padding:0 20px 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.dot.run{background:#5fc89a}.dot.wait{background:#d9b878}.dot.review{background:#9c8ae0}.dot.fail{background:#d97a78}
.legend-note{margin-left:auto;color:var(--faint)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;font:10px var(--mono);letter-spacing:.06em;color:rgba(232,245,250,.5);background:rgba(6,10,14,.5);border:1px solid rgba(140,225,250,.16);border-radius:99px;padding:4px 10px;pointer-events:none;white-space:nowrap}
:root[data-theme="light"] .hint{color:rgba(10,20,26,.55);background:rgba(250,253,255,.6)}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <span class="kicker">SCENE · 3D SPIKE</span>
      <h1>作战室 · 指挥中心 <span class="tag">THREE.JS</span></h1>
      <p class="sub">同一批 run / delegation，换成三维房间：视频墙、操作台、值班席、屏幕反光。用来判断 3D 值不值得进主原型。</p>
    </div>
    <div class="actions">
      <a class="btn" href="warroom.html">← 2D 原型</a>
      <button class="btn" id="themeBtn">亮 / 暗</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hint">拖动 / 移动鼠标 = 轻微视角偏移 · 双击复位</div>
  </div>
  <div class="legend">
    <span><i class="dot run"></i>运行</span>
    <span><i class="dot wait"></i>待确认</span>
    <span><i class="dot review"></i>待验收</span>
    <span><i class="dot fail"></i>失败</span>
    <span class="legend-note">状态来自 runs / delegations / approvals，舞台只负责呈现</span>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script>
(function () {
  'use strict';
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('gl');

  const PAL = {
    dark: {
      bg: 0x05080b, fog: 0x05080b, wall: 0x171c21, wall2: 0x111619, floor: 0x070a0d,
      ceil: 0x0a0d10, metal: 0x11161b, glow: 0x6fd6f5, glowCss: '#6fd6f5',
      panel: '#070a0d', panel2: '#04070a', ink: '#dbe8ee', ink2: 'rgba(219,232,238,.66)',
      ink3: 'rgba(219,232,238,.40)', green: '#7fd6a4', amber: '#d9b878', red: '#d97a78', purple: '#9c8ae0',
      amb: 0.10, hemi: 0.14, key: 0.4, spill: 0.7
    },
    light: {
      bg: 0xdfe7ee, fog: 0xdfe7ee, wall: 0xc4ced7, wall2: 0xaeb9c3, floor: 0x12171d,
      ceil: 0xe6ecf2, metal: 0x2b333b, glow: 0x2f9fc4, glowCss: '#2f9fc4',
      panel: '#070b0e', panel2: '#04070a', ink: '#dbe8ee', ink2: 'rgba(219,232,238,.66)',
      ink3: 'rgba(219,232,238,.40)', green: '#5fc89a', amber: '#d9b878', red: '#d97a78', purple: '#9c8ae0',
      amb: 0.22, hemi: 0.26, key: 0.6, spill: 0.5
    }
  };
  const qs = new URLSearchParams(location.search);
  if (qs.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
  if (qs.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  let pal = PAL[document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'];

  /* ---------- renderer / scene ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const exposure = 0.72;

  /* ---------- cheap bloom: bright → blur → composite ---------- */
  const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
  const rtScene = new THREE.WebGLRenderTarget(2, 2, { ...rtOpts, depthBuffer: true });
  const rtA = new THREE.WebGLRenderTarget(2, 2, { ...rtOpts, depthBuffer: false });
  const rtB = new THREE.WebGLRenderTarget(2, 2, { ...rtOpts, depthBuffer: false });
  const quadScene = new THREE.Scene();
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  quadScene.add(quad);
  const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uThreshold: { value: .95 }, uKnee: { value: .06 } },
    vertexShader: VS,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uThreshold; uniform float uKnee; varying vec2 vUv;
      void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; float l = max(c.r, max(c.g, c.b));
        float s = smoothstep(uThreshold, uThreshold + uKnee, l); gl_FragColor = vec4(c * s, 1.0); }`,
    depthTest: false, depthWrite: false
  });
  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } },
    vertexShader: VS,
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
      void main(){
        vec3 s = texture2D(tDiffuse, vUv).rgb * .227027;
        s += (texture2D(tDiffuse, vUv + uDir * 1.3846).rgb + texture2D(tDiffuse, vUv - uDir * 1.3846).rgb) * .3162162;
        s += (texture2D(tDiffuse, vUv + uDir * 3.2308).rgb + texture2D(tDiffuse, vUv - uDir * 3.2308).rgb) * .0702703;
        gl_FragColor = vec4(s, 1.0);
      }`,
    depthTest: false, depthWrite: false
  });
  const compMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: null }, tBloom: { value: null },
      uIntensity: { value: .18 }, uExposure: { value: exposure }, uVignette: { value: .55 }
    },
    vertexShader: VS,
    fragmentShader: `uniform sampler2D tScene; uniform sampler2D tBloom; uniform float uIntensity; uniform float uExposure; uniform float uVignette; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
      void main(){
        vec3 c = texture2D(tScene, vUv).rgb + texture2D(tBloom, vUv).rgb * uIntensity;
        c *= uExposure;
        c = aces(c);
        vec2 p = vUv - 0.5;
        float v = smoothstep(0.92, 0.28, length(p));
        c *= mix(1.0, v, uVignette);
        gl_FragColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
      }`,
    depthTest: false, depthWrite: false
  });
  function renderPost() {
    renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
    quad.material = brightMat; brightMat.uniforms.tDiffuse.value = rtScene.texture;
    renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam);
    quad.material = blurMat;
    blurMat.uniforms.tDiffuse.value = rtA.texture;
    blurMat.uniforms.uDir.value.set(1 / rtA.width, 0);
    renderer.setRenderTarget(rtB); renderer.render(quadScene, quadCam);
    blurMat.uniforms.tDiffuse.value = rtB.texture;
    blurMat.uniforms.uDir.value.set(0, 1 / rtA.height);
    renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam);
    quad.material = compMat;
    compMat.uniforms.tScene.value = rtScene.texture;
    compMat.uniforms.tBloom.value = rtA.texture;
    renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(pal.bg);
  scene.fog = new THREE.Fog(pal.fog, 13, 26);

  const camera = new THREE.PerspectiveCamera(33, 1, 0.1, 80);
  camera.position.set(0, 3.05, 12.2);
  const camTarget = new THREE.Vector3(0, 1.95, -2.4);

  /* ---------- helpers ---------- */
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    draw(ctx, w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding;
    t.needsUpdate = true;
    return t;
  }
  function radialGlow(size, color, inner, outer) {
    return canvasTex(size, size, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      g.addColorStop(0, inner); g.addColorStop(1, outer);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    });
  }
  const glowTex = radialGlow(256, pal.glowCss, 'rgba(120,220,250,.55)', 'rgba(120,220,250,0)');
  const softGlow = radialGlow(256, pal.glowCss, 'rgba(120,220,250,.22)', 'rgba(120,220,250,0)');

  // environment: a tiny painted room so metals / glass get real reflections
  const pmrem = new THREE.PMREMGenerator(renderer);
  function buildEnv() {
    const tex = canvasTex(1024, 512, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#202a33'); g.addColorStop(.48, '#0d1419'); g.addColorStop(1, '#070b0e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      const s = ctx.createRadialGradient(w * .5, h * .44, 8, w * .5, h * .44, w * .34);
      s.addColorStop(0, 'rgba(150,235,255,.95)'); s.addColorStop(.55, 'rgba(110,210,240,.25)'); s.addColorStop(1, 'rgba(110,210,240,0)');
      ctx.fillStyle = s; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(150,235,255,.85)';
      for (let i = 0; i < 3; i++) ctx.fillRect(w * .22 + i * w * .13, h * .10, w * .17, 5);
      ctx.fillStyle = 'rgba(8,12,16,.92)'; ctx.fillRect(0, h * .74, w, h * .26);
    });
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const rt = pmrem.fromEquirectangular(tex);
    scene.environment = rt.texture;
    tex.dispose();
  }
  buildEnv();

  const MAT = {
    wall: new THREE.MeshStandardMaterial({ color: pal.wall, roughness: .92, metalness: .02, envMapIntensity: .22 }),
    wall2: new THREE.MeshStandardMaterial({ color: pal.wall2, roughness: .95, metalness: .02, envMapIntensity: .18 }),
    floor: new THREE.MeshStandardMaterial({ color: pal.floor, roughness: .52, metalness: .28, envMapIntensity: .55 }),
    ceil: new THREE.MeshStandardMaterial({ color: 0x1a2229, roughness: .95, metalness: .02, envMapIntensity: .12 }),
    metal: new THREE.MeshStandardMaterial({ color: pal.metal, roughness: .38, metalness: .72 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x11171d, roughness: .42, metalness: .5 }),
    chair: new THREE.MeshStandardMaterial({ color: 0x1b2229, roughness: .68, metalness: .2 }),
    body: new THREE.MeshStandardMaterial({ color: 0xb9c7d2, roughness: .5, metalness: .12 }),
    emissive: (hex, i) => new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: i, roughness: .5, metalness: .1 })
  };

  /* ---------- room ---------- */
  const room = new THREE.Group(); scene.add(room);
  const RW = 19, RD = 13, RH = 4.6;

  // floor (slightly transparent so the mirrored screen reads as a reflection)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), MAT.floor);
  floor.material.transparent = true; floor.material.opacity = .9;
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 0); floor.receiveShadow = true;
  floor.renderOrder = 1;
  room.add(floor);

  // floor tile grid (subtle, additive)
  const tileTex = canvasTex(512, 512, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(140,225,250,.18)'; ctx.lineWidth = 2;
    for (let i = 0; i <= 4; i++) {
      const p = (i / 4) * w;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
    }
  });
  tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping; tileTex.repeat.set(5, 3.4);
  const tiles = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshBasicMaterial({
    map: tileTex, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  tiles.rotation.x = -Math.PI / 2; tiles.position.y = 0.006; tiles.renderOrder = 2; room.add(tiles);

  // back wall
  const back = new THREE.Mesh(new THREE.PlaneGeometry(RW, RH), MAT.wall);
  back.position.set(0, RH / 2, -RD / 2 + 0.1); back.receiveShadow = true;
  room.add(back);

  // side walls
  [-1, 1].forEach((s) => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(RD, RH), MAT.wall2);
    w.position.set(s * (RW / 2 - 0.1), RH / 2, 0);
    w.rotation.y = s > 0 ? -Math.PI / 2 : Math.PI / 2;
    room.add(w);
  });

  // ceiling
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), MAT.ceil);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, RH, 0);
  room.add(ceil);

  // ceiling light strips + wall seams (emissive)
  const stripMat = new THREE.MeshBasicMaterial({ map: softGlow, transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false });
  [-3.2, 0, 3.2].forEach((x, i) => {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.5), stripMat);
    s.rotation.x = Math.PI / 2;
    s.position.set(x, RH - 0.04, -2 + (i - 1) * 1.2);
    room.add(s);
  });
  [-6.2, -3.1, 3.1, 6.2].forEach((x) => {
    const trim = new THREE.Mesh(new THREE.BoxGeometry(0.06, RH, 0.04), MAT.metal);
    trim.position.set(x, RH / 2, -RD / 2 + 0.13); room.add(trim);
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.012, RH - 0.5, 0.02), MAT.emissive(pal.glow, 0.45));
    s.position.set(x - 0.04, RH / 2, -RD / 2 + 0.15); room.add(s);
  });
  // horizontal wall trim
  const htrim = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.04, 0.04), MAT.metal);
  htrim.position.set(0, RH * 0.62, -RD / 2 + 0.13); room.add(htrim);
  // skirting LEDs on the side walls
  [-1, 1].forEach((sgn) => {
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.012, RD - 0.5), MAT.emissive(pal.glow, 0.5));
    led.position.set(sgn * (RW / 2 - 0.12), 0.07, 0); room.add(led);
  });
  // ceiling coffer rims (soft, not beams)
  [-3.4, 3.4].forEach((x) => {
    const rim = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, RD - 1.2), new THREE.MeshStandardMaterial({ color: 0x1b232a, roughness: .85, metalness: .1 }));
    rim.position.set(x, RH - 0.03, 0); room.add(rim);
  });
  // baseboard
  const base = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.06, 0.06), MAT.emissive(pal.glow, 0.55));
  base.position.set(0, 0.05, -RD / 2 + 0.12);
  room.add(base);

  // ceiling wash light
  const ceilLight = new THREE.PointLight(pal.glow, pal.spill * 0.06, 14, 2);
  ceilLight.position.set(0, RH - 0.4, -1.5); room.add(ceilLight);
  const ceilPanel = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.2), new THREE.MeshBasicMaterial({
    map: softGlow, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  }));
  ceilPanel.rotation.x = Math.PI / 2; ceilPanel.position.set(0, RH - 0.02, -1.2); room.add(ceilPanel);

  // floor light pools (fake reflections)
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 2.6), new THREE.MeshBasicMaterial({
    map: softGlow, transparent: true, opacity: .28, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pool.rotation.x = -Math.PI / 2; pool.position.set(0, 0.012, -3.4); room.add(pool);

  /* ---------- video wall ---------- */
  const wall = new THREE.Group(); scene.add(wall);
  const VW = 10.4, VH = 3.9, VZ = -RD / 2 + 0.35;
  wall.position.set(0, 2.62, VZ);

  // frame: outer chamfer + inner recess + soundbar
  const frame = new THREE.Mesh(new THREE.BoxGeometry(VW + 0.30, VH + 0.30, 0.20), MAT.metal);
  frame.position.z = -0.03; frame.castShadow = true; wall.add(frame);
  const chamfer = new THREE.Mesh(new THREE.BoxGeometry(VW + 0.20, VH + 0.20, 0.10), new THREE.MeshStandardMaterial({ color: 0x0d1216, roughness: .35, metalness: .8 }));
  chamfer.position.z = 0.02; wall.add(chamfer);
  const innerRim = new THREE.Mesh(new THREE.BoxGeometry(VW + 0.04, VH + 0.04, 0.06), new THREE.MeshStandardMaterial({ color: 0x05080b, roughness: .5, metalness: .6 }));
  innerRim.position.z = 0.055; wall.add(innerRim);
  const soundbar = new THREE.Mesh(new THREE.BoxGeometry(VW * 0.62, 0.11, 0.12), MAT.metal);
  soundbar.position.set(0, -VH / 2 - 0.24, 0.02); wall.add(soundbar);
  const sbLed = new THREE.Mesh(new THREE.BoxGeometry(VW * 0.16, 0.012, 0.012), MAT.emissive(pal.glow, 0.9));
  sbLed.position.set(0, -VH / 2 - 0.24, 0.09); wall.add(sbLed);

  // screen texture
  function drawHUD(ctx, w, h) {
    const P = pal;
    ctx.clearRect(0, 0, w, h);
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, P.panel); bg.addColorStop(1, P.panel2);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    // subtle grid + scanlines
    ctx.strokeStyle = 'rgba(140,225,250,.03)'; ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 128) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 128) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(150,225,248,.022)';
    for (let y = 0; y < h; y += 5) ctx.fillRect(0, y, w, 1);

    const mono = (s) => s + 'px "Geist Mono Variable", "SF Mono", Menlo, monospace';
    const sans = (s, wgt) => (wgt || 500) + ' ' + s + 'px "Geist Variable", -apple-system, "PingFang SC", sans-serif';
    const M = 110;
    ctx.textBaseline = 'middle';

    // header

  }

  function labelSprite(a) {
    const toneColor = { run: '#5fc89a', wait: '#d9b878', review: '#9c8ae0', fail: '#d97a78', lead: '#6fd6f5', idle: '#8f9aa3' }[a.tone];
    return canvasTex(512, 160, (ctx, w, h) => {
      const pad = 14, r = 10;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(8,12,16,.82)';
      ctx.strokeStyle = 'rgba(140,225,250,.22)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pad + r, pad); ctx.lineTo(w - pad - r, pad); ctx.quadraticCurveTo(w - pad, pad, w - pad, pad + r);
      ctx.lineTo(w - pad, h - pad - r); ctx.quadraticCurveTo(w - pad, h - pad, w - pad - r, h - pad);
      ctx.lineTo(pad + r, h - pad); ctx.quadraticCurveTo(pad, h - pad, pad, h - pad - r);
      ctx.lineTo(pad, pad + r); ctx.quadraticCurveTo(pad, pad, pad + r, pad); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = toneColor; ctx.beginPath(); ctx.arc(pad + 26, 52, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9f1f5'; ctx.font = '600 34px "Geist Variable", -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(a.name, pad + 46, 64);
      ctx.fillStyle = 'rgba(219,232,238,.5)'; ctx.font = '500 24px "Geist Variable", -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(a.role, pad + 46 + ctx.measureText(a.name).width + 30, 64);
      ctx.fillStyle = 'rgba(219,232,238,.42)'; ctx.font = '500 24px "Geist Mono Variable", Menlo, monospace';
      ctx.fillText(a.short, pad + 26, 112);
    });
  }

  const agents = [];
  AGENTS.forEach((a) => {
    const g = new THREE.Group();
    g.position.set(a.x, 0, a.z);
    if (!a.stand) g.add(chairMesh());
    const bodyY = a.stand ? 1.16 : 0.92;
    const headY = a.stand ? 1.52 : 1.2;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.165, a.stand ? 0.52 : 0.2, 8, 16), MAT.body);
    body.position.set(0, bodyY, 0); body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.135, 20, 20), new THREE.MeshStandardMaterial({ color: 0xd6e1ea, roughness: .45, metalness: .08 }));
    head.position.set(0, headY, 0); head.castShadow = true; g.add(head);
    // shoulders + collar
    const sh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.07, 0.19), new THREE.MeshStandardMaterial({ color: 0x8f9eab, roughness: .55, metalness: .15 }));
    sh.position.set(0, headY - 0.17, 0); g.add(sh);
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.014, 8, 20), MAT.metal);
    collar.rotation.x = Math.PI / 2; collar.position.set(0, headY - 0.16, 0); g.add(collar);
    // headset (arc + mic boom)
    const hs = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.011, 6, 20, Math.PI * 1.15), MAT.metal);
    hs.rotation.set(Math.PI / 2, 0, Math.PI * 0.42); hs.position.set(0, headY + 0.01, 0); g.add(hs);
    const mic = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.1, 6), MAT.metal);
    mic.rotation.z = 0.5; mic.position.set(0.11, headY - 0.06, 0.02); g.add(mic);
    // back pack + accent bar (reads from behind)
    const pack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.09), new THREE.MeshStandardMaterial({ color: 0x1d252d, roughness: .6, metalness: .25 }));
    pack.position.set(0, bodyY + 0.02, 0.14); g.add(pack);
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 0.01), MAT.emissive(a.accent, 0.9));
    band.position.set(0, bodyY + 0.1, 0.19); g.add(band);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: labelSprite(a), transparent: true, depthWrite: false, depthTest: false,
      sizeAttenuation: true
    }));
    spr.scale.set(0.92, 0.29, 1);
    spr.position.set(0, headY + 0.2, 0);
    g.add(spr);
    scene.add(g);
    agents.push(g);
  });

  /* ---------- lights ---------- */
  const amb = new THREE.AmbientLight(0xbfd8e6, pal.amb); scene.add(amb);
  const hemi = new THREE.HemisphereLight(0x9fd8f0, 0x0a0e12, pal.hemi); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xdff2ff, pal.key);
  key.position.set(3.5, 6.5, 6); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
  key.shadow.bias = -0.0008;
  scene.add(key);
  const rim = new THREE.DirectionalLight(pal.glow, 0.5);
  rim.position.set(-4, 3.4, 3); scene.add(rim);
  const screenLight = new THREE.PointLight(pal.glow, 1.1, 14, 2);
  screenLight.position.set(0, 2.6, VZ + 0.9); scene.add(screenLight);

  /* ---------- interaction / loop ---------- */
  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  stage.addEventListener('pointermove', (e) => {
    const r = stage.getBoundingClientRect();
    pointer.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    pointer.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });
  stage.addEventListener('dblclick', () => { pointer.tx = 0; pointer.ty = 0; });

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let t = 0;
  const clock = new THREE.Clock();

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    const pr = renderer.getPixelRatio();
    const bw = Math.max(2, Math.floor(w * pr)), bh = Math.max(2, Math.floor(h * pr));
    rtScene.setSize(bw, bh);
    rtA.setSize(Math.max(2, Math.floor(bw / 2)), Math.max(2, Math.floor(bh / 2)));
    rtB.setSize(Math.max(2, Math.floor(bw / 2)), Math.max(2, Math.floor(bh / 2)));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  renderPost();

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!reduce.matches) t += dt;
    // camera parallax
    pointer.x += (pointer.tx - pointer.x) * 0.05;
    pointer.y += (pointer.ty - pointer.y) * 0.05;
    camera.position.x = pointer.x * 0.6;
    camera.position.y = 3.05 - pointer.y * 0.22;
    camera.lookAt(camTarget);
    // globe
    globe.rotation.y = t * 0.08;
    globeMat.uniforms.uTime.value = t;
    orbit.rotation.z = 0.32 + t * 0.05;
    sats.forEach((s, i) => {
      const a = s.userData.a + t * 0.24;
      const r = 1.24, inc = 0.35;
      s.position.set(Math.cos(a) * r, Math.sin(a) * r * Math.sin(inc), Math.sin(a) * r * Math.cos(inc));
    });
    renderPost();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.dataset.theme === 'light' ? 'dark' : 'light';
    html.dataset.theme = next;
    pal = PAL[next];
    document.body.style.background = '#' + pal.bg.toString(16).padStart(6, '0');
    // rebuild palette-dependent bits
    scene.background = new THREE.Color(pal.bg);
    scene.fog.color = new THREE.Color(pal.fog);
    MAT.wall.color.set(pal.wall); MAT.wall2.color.set(pal.wall2);
    MAT.floor.color.set(pal.floor); MAT.ceil.color.set(pal.ceil);
    MAT.metal.color.set(pal.metal);
    amb.color.set(0xbfd8e6); amb.intensity = pal.amb;
    hemi.intensity = pal.hemi; key.intensity = pal.key;
    rim.color.set(pal.glow);
    globeMat.uniforms.uGlow.value.set(pal.glow);
    atmoMat.uniforms.uGlow.value.set(pal.glow);
    // rebuild emissive/glow materials and textures
    stripMat.opacity = next === 'light' ? .62 : .5;
    base.material.color.set(pal.glow); base.material.emissive.set(pal.glow);
    led.material.color.set(pal.glow); led.material.emissive.set(pal.glow);
    pool.material.opacity = next === 'light' ? .4 : .55;
    deskGlow.material.opacity = next === 'light' ? .38 : .5;
    const newHud = canvasTex(2048, 768, drawHUD);
    screen.material.map.dispose(); screen.material.map = newHud; screen.material.needsUpdate = true;
    ['a', 'b', 'c'].forEach((k, i) => {
      const t = monitorTexture(k);
      const f = monFaces[i];
      if (f) {
        if (f.material.map) f.material.map.dispose();
        f.material.map = t; f.material.needsUpdate = true;
      }
    });
  });
})();
</script>
</body>
