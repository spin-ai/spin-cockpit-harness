<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人格 bot · 原型</title>
<!--
  人格 bot 原型（多 bot · 主打主动 · 能起 Agent 任务 · 可读四层记忆）
  ──────────────────────────────────────────────────────────────
  为什么做这一页：
  0. 落脚点：机器人不是 rail 上的一页。它在工作区左栏、项目列表上面（参考 Orca 的 sidebar bots
     split：两段各带折叠、中间一条可分缝，机器人 min 88px、项目至少留 3 行 ≈ 120px）。点一个 bot，
     中间换成它那条回合流；项目仍然在下面，切项目不用离开这一屏。
  1. 多 bot：人格、记忆视图、配额、频道 allowlist 按 botId 隔离——左栏是 bot 列表，不是会话列表。
  2. 主打主动：中间是「回合流」，主动消息与「沉默 / 被拦 / 转人工」并排出现；
     每条都能展开「为什么说」（触发源 / 注入的记忆 / 过闸结果 / 成本），沉默也要有原因。
  3. 能起任务：dispatch 档位的 bot 只说「我理解的是 X，要现在开吗」，真正起 run 仍走人的审批。
  4. 四层记忆：右栏能看当前 bot 读到哪四层、本轮注入了哪几条、预算用了多少；L1 默认只回查。
  设计约束与 src/design-system.css 一致：一个主面、hairline 分节、一个 primary、中文 ≥11.5px。
  双击即可打开，无构建、无依赖；右上 ◐ 切亮暗；?theme=light|dark、?bot=golo 定格。
-->
<style>
:root{
  --font-sans:"Geist Variable","Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"Geist Mono Variable","Geist Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow-1:0 1px 2px rgba(10,10,10,.045);
  --shadow-float:0 18px 46px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10);
  --green:#3f9a68;--green-soft:#edf8f2;--green-line:#d5eedf;
  --amber:#a97a2f;--amber-soft:#fdf8ee;--amber-line:#f2e3c4;
  --red:#cf5f5d;--red-soft:#fdf2f2;--red-line:#f4d7d7;
  --purple:#7d67d1;--purple-soft:#f4f2fd;--purple-line:#e3ddf8;
}
:root[data-theme="light"]{
  --page-canvas:#fafafa;--surface:#ffffff;--surface-hover:#f5f5f5;--surface-selected:#ededed;
  --sidebar:#fafafa;--border:#e5e5e5;--border-strong:#d4d4d4;--input:#e5e5e5;
  --fg:#0a0a0a;--fg-2:#3f3f3f;--muted:#5c5c5c;--faint:#8a8a8a;
  --brand:#171717;--brand-soft:#f2f2f2;--brand-line:#dedede;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page-canvas:#0a0a0a;--surface:#171717;--surface-hover:#262626;--surface-selected:#2e2e2e;
  --sidebar:#111111;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--input:rgba(255,255,255,.16);
  --fg:#f0f0f0;--fg-2:#d4d4d4;--muted:#a3a3a3;--faint:#737373;
  --brand:#e5e5e5;--brand-soft:#262626;--brand-line:#3a3a3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page-canvas);color:var(--fg);font:13px/1.56 var(--font-sans);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.28);border-radius:8px;border:3px solid transparent;background-clip:content-box}

.app{display:grid;grid-template-columns:64px 224px minmax(0,1fr) 304px;height:100%}

/* rail：与主应用一致，只做导航提示 */
.rail{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0}
.rail-btn{width:52px;height:48px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;line-height:1}
.rail-btn.on{background:var(--surface-selected);color:var(--fg)}
.rail-btn:hover{background:var(--surface-hover);color:var(--fg)}
.rail-spacer{flex:1}

/* 左：机器人（上）+ 项目（下）。机器人不单独占一页，参考 Orca 的 sidebar bots split：
   两段各可折叠，中间一条可分缝；Orca 常量 SIDEBAR_BOTS_MIN_HEIGHT=88 / SIDEBAR_PROJECTS_MIN_LIST_HEIGHT=120 */
.col{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.sec{display:flex;flex-direction:column;min-height:0}
.bots-sec{flex:0 1 auto;min-height:88px;max-height:40%}
.proj-sec{flex:1 1 auto;min-height:120px}
.sec-head{display:flex;align-items:center;gap:6px;padding:11px 8px 7px 8px;color:var(--muted)}
.sec-head h2{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.sec-head em{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--faint)}
.sec-head .spacer{flex:1}
.fold{width:18px;height:18px;flex:none;border:0;background:transparent;border-radius:4px;color:var(--faint);display:grid;place-items:center}
.fold:hover{background:var(--surface-hover);color:var(--fg-2)}
.fold svg{transition:transform .12s ease}
.sec.folded .fold svg{transform:rotate(-90deg)}
.sec.folded .bot-list,.sec.folded .proj-list,.sec.folded .sec-hint{display:none}
.sec.folded .sec-head{padding-bottom:8px}
.icon-btn{width:20px;height:20px;flex:none;border:0;background:transparent;border-radius:4px;color:var(--faint);font-size:13px;line-height:1}
.icon-btn:hover{background:var(--surface-hover);color:var(--fg-2)}
.sec-hint{padding:0 10px 6px 32px;font-size:11px;color:var(--faint)}
.bot-list{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.bot{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px;border:0;background:transparent;border-radius:8px;text-align:left;color:var(--fg-2)}
.bot:hover{background:var(--surface-hover)}
.bot.on{background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--brand)}
.avatar{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
.avatar.a{background:#5b6cc0}.avatar.b{background:#3f8f86}.avatar.c{background:#b46a3c}
.bot-main{min-width:0}
.bot-main b{display:block;font-size:12.5px;font-weight:600;color:var(--fg)}
.bot-main span{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:6px;height:6px;border-radius:999px;background:var(--green)}
.dot.paused{background:var(--faint)}
.dot.quiet{background:var(--amber)}
/* 分缝：1px hairline，上面 8px 是拓开的抓手；拖动时只换高度，不换颜色块 */
.seam{flex:none;height:1px;background:var(--border);position:relative;cursor:row-resize;touch-action:none}
.seam::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.seam:hover,.seam:focus-visible{background:var(--border-strong);outline:none}
.seam[hidden]{display:none}
/* 项目在上面机器人下面：每行一个紧奏的列表项，不叠卡片 */
.proj-list{overflow:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:1px}
.proj{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px;
  padding:5px 6px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;font-size:12px;color:var(--fg-2)}
.proj:hover{background:var(--surface-hover)}
.proj.on{background:var(--surface-selected);border-color:var(--border);color:var(--fg)}
.proj-mark{width:18px;height:18px;flex:none;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;
  background:var(--surface-hover);border:1px solid var(--border);color:var(--muted)}
.proj .count{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.ellipsis{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 中：回合流 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--page-canvas)}
.head{display:flex;align-items:center;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--border);background:var(--page-canvas)}
.head-copy{min-width:0;flex:1}
.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.head h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:-.03em}
.head .sub{margin-top:2px;font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:8px}
.btn{height:30px;padding:0 11px;border:1px solid var(--input);background:var(--surface);color:var(--fg-2);border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--page-canvas)}
.btn.tiny{height:24px;padding:0 8px;font-size:12px}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--fg)}
.tag{font-size:11.5px;line-height:17px;padding:0 6px;border-radius:5px;border:1px solid var(--border);background:var(--surface-hover);color:var(--fg-2);white-space:nowrap}
.tag.ok{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.tag.warn{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.tag.fail{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.tag.ai{color:var(--purple);border-color:var(--purple-line);background:var(--purple-soft)}
.tag.mono{font-family:var(--mono);font-size:11px}

.stream{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.day{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11px;letter-spacing:.06em}
.day::after{content:"";flex:1;height:1px;background:var(--border)}

.turn{display:flex;gap:10px;min-width:0}
.turn .avatar{flex:none;margin-top:2px}
.turn-body{min-width:0;flex:1}
.turn-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.turn-meta b{font-weight:600;color:var(--fg-2)}
.bubble{margin-top:5px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13.5px;line-height:1.6;color:var(--fg);max-width:min(62ch,100%)}
.bubble .quote{display:block;margin:6px 0 0;padding-left:8px;border-left:2px solid var(--border-strong);color:var(--muted);font-size:12px}
.reply-actions{display:flex;gap:6px;margin-top:7px}
.why{margin-top:6px}
.why-toggle{border:0;background:transparent;padding:0;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.why-toggle:hover{color:var(--fg)}
.why-toggle i{font-style:normal;transition:transform .12s}
.why[open] .why-toggle i{transform:rotate(90deg)}
.why-body{margin-top:6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.why-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;font-size:11.5px;line-height:1.55}
.why-row span{color:var(--faint)}
.why-row b{font-weight:500;color:var(--fg-2)}
.mem-chip{display:inline-flex;align-items:center;gap:4px;margin:0 4px 4px 0;padding:0 5px;border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--fg-2);background:var(--surface-hover)}
.mem-chip em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:10.5px}

/* 沉默 / 被拦 / 转人工：不画成气泡，避免和"说过的话"混淆 */
.quiet-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 2px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}
.quiet-row:last-child{border-bottom:0}
.quiet-row .mark{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;border:1px dashed var(--border-strong);color:var(--faint);font-size:11px}
.quiet-row.blocked .mark{border-color:var(--amber-line);color:var(--amber)}
.quiet-row.escalated .mark{border-color:var(--purple-line);color:var(--purple)}
.quiet-row.escalated b{color:var(--fg)}
.quiet-row b{font-weight:500;color:var(--fg-2);margin-right:6px}
.quiet-row .why-toggle{font-size:11px}

.composer{border-top:1px solid var(--border);padding:10px 20px 14px;background:var(--page-canvas)}
.composer-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--input);border-radius:10px;background:var(--surface);padding:8px 10px}
.composer-box textarea{flex:1;resize:none;border:0;background:transparent;outline:none;min-height:22px;max-height:120px;font-size:13.5px;line-height:1.55}
.composer-hint{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--faint);flex-wrap:wrap}

/* 右：Inspector */
.side{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--border)}
.tabs button{height:26px;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 10px;border-radius:6px 6px 0 0}
.tabs button.on{background:var(--page-canvas);color:var(--fg);font-weight:600;box-shadow:inset 0 -1px 0 var(--border)}
.tabs button:hover{color:var(--fg)}
.side-scroll{overflow:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:16px}
.side h3{margin:0 0 6px;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;color:var(--fg-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b.mono{font-family:var(--mono);font-size:11.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.bar{height:5px;border-radius:99px;background:var(--surface-hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);opacity:.72}
.bar.warn i{background:var(--amber);opacity:1}
.note{font-size:11.5px;line-height:1.6;color:var(--muted)}
.persona-field{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px solid var(--border)}
.persona-field:last-child{border-bottom:0}
.persona-field span{font-size:11px;color:var(--faint)}
.persona-field b{font-weight:500;font-size:12.5px;color:var(--fg-2);line-height:1.5}
.layer{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.layer:last-child{border-bottom:0}
.layer .l{width:26px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.layer .n{flex:1;min-width:0}
.layer .n b{display:block;font-weight:500;color:var(--fg-2)}
.layer .n span{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.switch{width:32px;height:18px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface-hover);position:relative;flex:none;padding:0}
.switch i{position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:99px;background:var(--faint);transition:left .12s,background .12s}
.switch.on{background:var(--fg);border-color:var(--fg)}
.switch.on i{left:16px;background:var(--page-canvas)}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.mono{font-family:var(--mono)}
.tiny{font-size:11.5px}
.faint{color:var(--faint)}
.muted{color:var(--muted)}
.spacer{flex:1}

/* 审批卡（起任务前的一步确认） */
.approve{margin-top:8px;border:1px solid var(--purple-line);background:var(--purple-soft);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.approve b{font-size:12.5px;color:var(--fg)}
.approve p{margin:0;font-size:12px;color:var(--fg-2);line-height:1.55}
.approve .row{gap:6px}
:root[data-theme="dark"] .approve{background:color-mix(in srgb,var(--purple) 14%,var(--surface));border-color:color-mix(in srgb,var(--purple) 40%,var(--border))}

/* 一行提醒：频控/静音生效中 */
.banner{display:flex;align-items:center;gap:8px;margin:0 20px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:11.5px;color:var(--muted)}
.banner .dot{background:var(--amber)}
:root[data-theme="dark"] .banner{background:color-mix(in srgb,var(--amber) 8%,var(--surface))}

@media (max-width:1180px){
  .app{grid-template-columns:64px 184px minmax(0,1fr)}
  .side{display:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <button class="rail-btn on" aria-current="page"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 10h6"/></svg><span>工作区</span></button>
    <button class="rail-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg><span>项目</span></button>
    <button class="rail-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/></svg><span>知识库</span></button>
    <button class="rail-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M5 7v10M19 7v10M8.5 5v14M15.5 5v14"/></svg><span>记忆</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0 1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9 2 2 0 1 1 2.8-2.8 1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4"/></svg><span>设置</span></button>
  </nav>

  <!-- 左栏：机器人（上）→ 分缝 → 项目（下）。机器人不是一个页面，它只是这一列的第一段 -->
  <aside class="col" aria-label="机器人 / 项目">
    <section class="sec bots-sec" aria-label="机器人">
      <div class="sec-head">
        <button class="fold" data-fold aria-expanded="true" title="收起机器人"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <h2>机器人</h2><em id="botCount">3</em>
        <span class="spacer"></span>

const $ = (sel) => document.querySelector(sel);

const glyph = (kind) => kind === "blocked" ? "✕" : kind === "escalated" ? "↗" : "·";
const fmtWhy = (turn) => {
  const why = turn.why || {};
  const mem = (why.inject || []).length
    ? why.inject.map(([layer, text]) => `<span class="mem-chip"><em>${layer}</em>${text}</span>`).join("")

  return `
    <details class="why">
      <summary class="why-toggle"><i>›</i>为什么${turn.kind === "quiet" ? "沉默" : turn.kind === "blocked" ? "被拦" : turn.kind === "escalated" ? "转人工" : "说"}</summary>

        <div class="why-row"><span>成本</span><b class="mono">${why.cost || "—"}</b></div>

};

function renderStream() {
  const bot = BOTS.find((b) => b.id === state.botId);
  const stream = $("#stream");
  stream.innerHTML = `<div class="day">今天 · ${bot.turns.length} 个回合</div>`;
  for (const turn of bot.turns) {
    if (turn.kind === "quiet" || turn.kind === "blocked" || turn.kind === "escalated") {
      stream.insertAdjacentHTML("beforeend", `
        <div class="turn quiet-row ${turn.kind}">
          <div class="mark">${glyph(turn.kind)}</div>
          <div><b>${turn.title}</b><span class="muted">${turn.reason || ""}</span>${fmtWhy(turn)}</div>
          <span class="mono faint tiny">${turn.time}</span>
        </div>`);
      continue;
    }
    stream.insertAdjacentHTML("beforeend", `
      <div class="turn">
        <div class="avatar ${bot.avatarClass}">${bot.avatar}</div>
        <div class="turn-body">
          <div class="turn-meta">
            <b>${bot.name}</b>
            <span>${turn.time}</span>
            <span class="tag ${turn.title === "主动" ? "ai" : ""}">${turn.title}</span>
            ${turn.dispatch ? '<span class="tag warn">dispatch</span>' : ""}

                </div>
              </div>` : ""}
          </div>
          ${fmtWhy(turn)}
        </div>
      </div>`);
  }
  stream.scrollTop = stream.scrollHeight;
}

function renderBots() {
  const list = $("#botList");
  list.innerHTML = "";
  for (const bot of BOTS) {
    const paused = state.paused[bot.id];
    const muted = state.muted[bot.id];
    const dot = paused ? "paused" : muted ? "quiet" : "";
    const btn = document.createElement("button");
    btn.className = `bot ${bot.id === state.botId ? "on" : ""}`;
    btn.innerHTML = `
      <span class="avatar ${bot.avatarClass}">${bot.avatar}</span>
      <span class="bot-main"><b>${bot.name}</b><span>${bot.mode} · ${bot.role}</span></span>
      <span class="dot ${dot}" title="${paused ? "已暂停" : muted ? "静音中" : "运行中"}"></span>`;
    btn.addEventListener("click", () => { state.botId = bot.id; renderAll(); });
    list.appendChild(btn);
  }
  $("#botCount").textContent = String(BOTS.length);
  const pausedCount = BOTS.filter((b) => state.paused[b.id]).length;
  $("#botHint").textContent = `${BOTS.length - pausedCount} 个在跑 · ${BOTS.filter((b) => b.mode === "主动" && !state.paused[b.id]).length} 个主动`;

/* ---------------- 左栏分缝 / 折叠 ---------------- */
/* Orca 常量：机器人才留 header + 一行 bot + 分缝 = 88px；项目下面至少留 3 行 = 120px。
   拖动只改高度，上限 = 当前机器人 + 当前项目列表 - 120，永远不会把项目挤没。 */
const BOTS_MIN = 88, PROJ_MIN = 120;
const botsSec = () => document.querySelector(".bots-sec");
const projSec = () => document.querySelector(".proj-sec");

let botsHeight = null;   // null = 内容高度，最多 40%（Orca 的默认 cap）
function setBotsHeight(px) {
  botsHeight = px == null ? null : Math.round(px);
  applyBotsHeight();
}
function applyBotsHeight() {
  const sec = botsSec();
  if (botsHeight == null) { sec.style.height = ""; sec.style.maxHeight = "40%"; return; }
  sec.style.maxHeight = "none";
  sec.style.height = `${botsHeight}px`;
}

function syncSeam() {
  const bots = botsSec(), proj = projSec();
  const foldedBots = bots.classList.contains("folded");
  const foldedProj = proj.classList.contains("folded");
  // 折叠了就没有分缝可拖：剩下一段自己占满（Orca：projectsCollapsed 时 Bots 拿整列高度）
  $("#seam").hidden = foldedBots || foldedProj;
  bots.style.flex = foldedBots ? "0 0 auto" : foldedProj ? "1 1 auto" : "0 1 auto";
  bots.style.minHeight = foldedBots || foldedProj ? "0px" : `${BOTS_MIN}px`;
  proj.style.flex = foldedProj ? "0 0 auto" : "1 1 auto";
  proj.style.minHeight = foldedProj ? "0px" : `${PROJ_MIN}px`;
  if (foldedBots || foldedProj) { bots.style.height = ""; bots.style.maxHeight = "none"; }
  else applyBotsHeight();
}

document.querySelectorAll("[data-fold]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const sec = btn.closest(".sec");
    const folded = sec.classList.toggle("folded");
    btn.setAttribute("aria-expanded", String(!folded));
    btn.title = folded ? "展开" : "收起";
    syncSeam();
  });
});

let drag = null;
$("#seam").addEventListener("pointerdown", (e) => {
  const sec = botsSec();
  drag = { y: e.clientY, h: sec.offsetHeight, max: sec.offsetHeight + $("#projList").offsetHeight - PROJ_MIN };
  $("#seam").setPointerCapture(e.pointerId);
  document.body.style.userSelect = "none";
});
$("#seam").addEventListener("pointermove", (e) => {
  if (!drag) return;
  setBotsHeight(Math.min(Math.max(drag.h + (e.clientY - drag.y), BOTS_MIN), Math.max(BOTS_MIN, drag.max)));
});
const endDrag = (e) => {
  if (!drag) return;
  drag = null;
  document.body.style.userSelect = "";
  try { $("#seam").releasePointerCapture(e.pointerId); } catch { /* ignore */ }
};
$("#seam").addEventListener("pointerup", endDrag);
$("#seam").addEventListener("pointercancel", endDrag);
/* 键盘等价：聚焦分缝后 ↑↓ 每次 16px */
$("#seam").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  const sec = botsSec();
  const step = (e.key === "ArrowDown" ? 16 : -16) * (e.altKey ? 4 : 1);
  const max = sec.offsetHeight + $("#projList").offsetHeight - PROJ_MIN;
  setBotsHeight(Math.min(Math.max(sec.offsetHeight + step, BOTS_MIN), Math.max(BOTS_MIN, max)));
});

/* ---------------- 交互 ---------------- */
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});
$("#pauseBtn").addEventListener("click", () => {
  const id = state.botId;
  state.paused[id] = !state.paused[id];
  renderAll();
});
$("#mut").addEventListener("click", () => { state.muted[state.botId] = true; renderAll(); });
$("#unmute").addEventListener("click", () => { state.muted[state.botId] = false; renderAll(); });

$("#simulate").addEventListener("click", () => {
  const bot = BOTS.find((b) => b.id === state.botId);
  if (state.paused[bot.id]) return;
  const muted = state.muted[bot.id];
  const now = new Date();
  const stamp = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  if (muted) {
    bot.turns.push({ kind: "quiet", time: stamp, title: "静音中", reason: "你手动静音了这小时", why: { trigger: "schedule · 每小时 tick", inject: [], gate: "quietHours / 手动静音", cost: "没调用模型" } });
  } else if (bot.budget.used >= bot.budget.limit) {
    bot.turns.push({ kind: "blocked", time: stamp, title: "被配额拦下", reason: `本小时已用 ${bot.budget.used}/${bot.budget.limit}`, why: { trigger: "todo.changed", inject: [], gate: "maxTurnsPerHour", cost: "没调用模型" } });
  } else {
    bot.budget.used += 1;
    bot.budget.tokens = Math.min(bot.budget.tokenLimit, bot.budget.tokens + 420);
    bot.turns.push({
      kind: "say", time: stamp, title: "主动",
      text: "刚看到 #2960 的备注又被你改了一次，如果只是记一笔，我就不插话了。",
      why: { trigger: "todo.changed · #2960 备注更新", inject: [["L3", "视觉解析插件在收尾"], ["L2", "偏好：少打扰"]], gate: `静音时段外 · 间隔 ≥ ${bot.policy.minGap} · 配额 ${bot.budget.used}/${bot.budget.limit}`, cost: "486 tokens · 1.1s" },
    });
  }
  renderAll();
});

$("#send").addEventListener("click", send); 
$("#say").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
function send() {
  const el = $("#say");
  const text = el.value.trim();
  if (!text) return;
  const bot = BOTS.find((b) => b.id === state.botId);
  const now = new Date();
  const stamp = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  bot.turns.push({
    kind: "say", time: stamp, title: "回你",
    text: bot.id === "golo" ? "好，我先不动。要开的时候你说一句，我再建任务。" : "收到，我记下了。",
    why: { trigger: "mention · 你直接说话", inject: [["L4", "起任务前必须一句确认"]], gate: "被动回复不受配额限制", cost: "284 tokens · 0.6s" },
  });
  el.value = "";
  renderAll();
}

document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b === btn));
    state.tab = btn.dataset.tab;
    renderSide();
  });
});

/* 起任务：走「一句话确认 → 人工审批」的最小闭环 */
document.addEventListener("click", (event) => {
  const doBtn = event.target.closest("[data-do]");
  if (!doBtn) return;
  const card = doBtn.closest("[data-approve]");
  const accept = doBtn.dataset.do === "accept";
  card.innerHTML = accept
    ? `<b>已建任务 #3014，等你在桌面审批</b><p class="tiny muted">run 还没起。审批通过后才会真的执行；不点就一直停在待审批。</p><div class="row"><span class="tag warn">waiting_input</span><span class="tiny faint">bot 不能自批</span></div>`
    : `<b>好，先不开</b><p class="tiny muted">我把这件事留在记忆里，下次同一话题再提。</p>`;
});

/* 参数：?theme=light|dark、?bot=<id> */
const params = new URLSearchParams(location.search);
if (params.get("theme") === "light" || params.get("theme") === "dark") document.documentElement.dataset.theme = params.get("theme");
const wantBot = params.get("bot");
if (wantBot && BOTS.some((b) => b.id === wantBot)) state.botId = wantBot;
const wantProj = params.get("proj");
if (wantProj && PROJECTS.some((p) => p.id === wantProj)) state.projId = wantProj;
renderAll();
/* 定格参数：?fold=bots|projects（可逗号叠加）、?h=<机器段像素高>，方便截图 */
for (const key of (params.get("fold") || "").split(",").filter(Boolean)) {
  const btn = document.querySelector(`${key === "projects" ? ".proj-sec" : ".bots-sec"} [data-fold]`);
  if (btn) btn.click();
}
const wantHeight = Number(params.get("h"));
if (wantHeight > 0) setBotsHeight(Math.max(BOTS_MIN, wantHeight));
syncSeam();
</script>
</body>
</html>
