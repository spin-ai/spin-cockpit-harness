  <text x="58" y="100" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >先落消息，再按会话状态决定行为；所有分支都写同一条 messages 表</text><rect x="58" y="404" width="260" height="112" rx="16" fill="#0b1220" stroke="none" stroke-width="1"  opacity="1" filter="url(#shadow)"  /><text x="188" y="444" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="30" font-weight="750" fill="#dbeafe" text-anchor="middle" opacity="1" letter-spacing="0" >send()</text><text x="188" y="472" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#93a4c4" text-anchor="middle" opacity="1" letter-spacing="0" >threadId · text · context</text><text x="188" y="495" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle" opacity="1" letter-spacing="0" >先落消息</text><path d="M318,460 C350,460 330,144 372,144" fill="none" stroke="#059669" stroke-width="1.8"  marker-end="url(#arrow-green)" opacity="0.85" /><rect x="372" y="100" width="476" height="88" rx="13" fill="#ffffff" stroke="#059669" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="100" width="5" height="88" rx="2.5" fill="#059669" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >草稿会话</text><text x="392" y="150" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >thread.todoId == null</text><rect x="690" y="114" width="138" height="30" rx="15" fill="#d1fae5" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="134.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#059669" text-anchor="middle" opacity="1" letter-spacing="0" >dispatch</text><text x="392" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#059669" text-anchor="start" opacity="1" letter-spacing="0" >建 TODO + queueRun</text><path d="M318,460 C350,460 330,264 372,264" fill="none" stroke="#2563eb" stroke-width="1.8"  marker-end="url(#arrow-blue)" opacity="0.85" /><rect x="372" y="220" width="476" height="88" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="220" width="5" height="88" rx="2.5" fill="#2563eb" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="248" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >有 running / waiting_input</text><text x="392" y="270" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >activeRunOf(todo.id)</text><rect x="690" y="234" width="138" height="30" rx="15" fill="#dbeafe" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="254.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#2563eb" text-anchor="middle" opacity="1" letter-spacing="0" >steer</text><text x="392" y="293" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >投给同一个 ACP client</text><path d="M318,460 C350,460 330,384 372,384" fill="none" stroke="#d97706" stroke-width="1.8"  marker-end="url(#arrow-amber)" opacity="0.85" /><rect x="372" y="340" width="476" height="88" rx="13" fill="#ffffff" stroke="#d97706" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="340" width="5" height="88" rx="2.5" fill="#d97706" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >有 queued run</text><text x="392" y="390" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >还没开跑</text><rect x="690" y="354" width="138" height="30" rx="15" fill="#fef3c7" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="374.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#d97706" text-anchor="middle" opacity="1" letter-spacing="0" >queued</text><text x="392" y="413" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#d97706" text-anchor="start" opacity="1" letter-spacing="0" >挂到本轮，startRun 时拼 prompt</text><path d="M318,460 C350,460 330,504 372,504" fill="none" stroke="#7c3aed" stroke-width="1.8"  marker-end="url(#arrow-purple)" opacity="0.85" /><rect x="372" y="460" width="476" height="88" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="460" width="5" height="88" rx="2.5" fill="#7c3aed" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="488" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >有任务、无 run</text><text x="392" y="510" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >未确认</text><rect x="690" y="474" width="138" height="30" rx="15" fill="#ede9fe" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="494.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#7c3aed" text-anchor="middle" opacity="1" letter-spacing="0" >run</text><text x="392" y="533" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#7c3aed" text-anchor="start" opacity="1" letter-spacing="0" >新起一次 run，消息带 runId</text><path d="M318,460 C350,460 330,624 372,624" fill="none" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow-slate)" opacity="0.85" /><rect x="372" y="580" width="476" height="88" rx="13" fill="#ffffff" stroke="#475569" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="580" width="5" height="88" rx="2.5" fill="#475569" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="608" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >已确认</text><text x="392" y="630" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >confirmed == true</text><rect x="690" y="594" width="138" height="30" rx="15" fill="#e2e8f0" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="614.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#475569" text-anchor="middle" opacity="1" letter-spacing="0" >note</text><text x="392" y="653" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start" opacity="1" letter-spacing="0" >只记录，不新建 run</text><path d="M318,460 C350,460 330,744 372,744" fill="none" stroke="#dc2626" stroke-width="1.8"  marker-end="url(#arrow-red)" opacity="0.85" /><rect x="372" y="700" width="476" height="88" rx="13" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"  opacity="1" filter="url(#shadow)"  /><rect x="372" y="700" width="5" height="88" rx="2.5" fill="#dc2626" stroke="none" stroke-width="1"  opacity="1"   /><text x="392" y="728" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1" letter-spacing="0" >没有可用 Agent</text><text x="392" y="750" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >没有执行适配器</text><rect x="690" y="714" width="138" height="30" rx="15" fill="#fee2e2" stroke="none" stroke-width="1"  opacity="1"   /><text x="759" y="734.04" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="750" fill="#dc2626" text-anchor="middle" opacity="1" letter-spacing="0" >error</text><text x="392" y="773" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="600" fill="#dc2626" text-anchor="start" opacity="1" letter-spacing="0" >不创建任务，保留草稿</text><line x1="848" y1="264" x2="912" y2="264" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow-blue)" opacity="1" /><rect x="912" y="214" width="260" height="70" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.3"  opacity="1"   /><text x="1042" y="243" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="750" fill="#059669" text-anchor="middle" opacity="1" letter-spacing="0" >injected</text><text x="1042" y="266" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400" fill="#047857" text-anchor="middle" opacity="1" letter-spacing="0" >prompt 成功 + 回执</text><line x1="848" y1="304" x2="912" y2="344" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow-blue)" opacity="1" /><rect x="912" y="320" width="260" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"  opacity="1"   /><text x="1042" y="349" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="750" fill="#dc2626" text-anchor="middle" opacity="1" letter-spacing="0" >failed</text><text x="1042" y="372" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400" fill="#991b1b" text-anchor="middle" opacity="1" letter-spacing="0" >保留消息 · 可重发</text><rect x="912" y="424" width="260" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"  opacity="1"   /><text x="1042" y="453" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="750" fill="#2563eb" text-anchor="middle" opacity="1" letter-spacing="0" >pending →</text><text x="1042" y="476" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" opacity="1" letter-spacing="0" >run 结束 / 停止统一标 failed</text><path d="M848,264 C880,264 880,459 912,459" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)" opacity="1" /><rect x="912" y="100" width="360" height="88" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"  opacity="1"   /><text x="932" y="132" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#166534" text-anchor="start" opacity="1" letter-spacing="0" >todo = createTodoFromMessage()</text><text x="932" y="156" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#166534" text-anchor="start" opacity="1" letter-spacing="0" >run = queueRun(todo, agent, &quot;chat&quot;)</text><text x="932" y="178" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#166534" text-anchor="start" opacity="1" letter-spacing="0" >message.runId = run.id</text><rect x="912" y="700" width="360" height="88" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"  opacity="1"   /><text x="932" y="732" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="650" fill="#9f1239" text-anchor="start" opacity="1" letter-spacing="0" >不产生孤儿 todo</text><text x="932" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="400" fill="#9f1239" text-anchor="start" opacity="1" letter-spacing="0" >输入框内容保留</text><text x="932" y="778" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#be123c" text-anchor="start" opacity="1" letter-spacing="0" >mode === &quot;error&quot;</text><rect x="58" y="842" width="1484" height="46" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"  opacity="1"   /><text x="78" y="871" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="start" opacity="1" letter-spacing="0" >为什么只有一个入口：派活 / 纠偏 / 排队补充 / 仅记录 共用同一套状态机，避免每个能力写两遍。</text><text x="58" y="928" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >改造前：messages 只能挂 todo_id，Chat 被迫分成「分派表单」和「会话」两态；改造后：thread 永远存在。</text>
