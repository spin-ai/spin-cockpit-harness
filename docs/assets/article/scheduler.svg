 height="76" rx="39" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"  opacity="1" filter="url(#shadow)"  /><text x="720" y="563" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle" opacity="1" letter-spacing="0" >Agent 有空位？</text><text x="720" y="586" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1" letter-spacing="0" >agent.max || 1</text><line x1="900" y1="570" x2="982" y2="570" stroke="#2563eb" stroke-width="1.8"  marker-end="url(#arrow-blue)" opacity="1" /><rect x="982" y="540" width="300" height="58" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="5 4" opacity="1"   /><text x="1000" y="564" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >queueReason =</text><text x="1000" y="584" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >&quot;Agent 忙&quot;</text><text x="720" y="624" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="650" fill="#059669" text-anchor="middle" opacity="1" letter-spacing="0" >是 ↓</text><line x1="720" y1="612" x2="720" y2="634" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow-slate)" opacity="1" /><rect x="540" y="638" width="360" height="76" rx="39" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"  opacity="1" filter="url(#shadow)"  /><text x="720" y="669" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle" opacity="1" letter-spacing="0" >同 cwd 没有运行？</text><text x="720" y="692" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" opacity="1" letter-spacing="0" >t.cwd === todo.cwd</text><line x1="900" y1="676" x2="982" y2="676" stroke="#7c3aed" stroke-width="1.8"  marker-end="url(#arrow-purple)" opacity="1" /><rect x="982" y="646" width="300" height="58" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="5 4" opacity="1"   /><text x="1000" y="670" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >queueReason =</text><text x="1000" y="690" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start" opacity="1" letter-spacing="0" >&quot;同目录串行&quot;</text><text x="720" y="730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="650" fill="#059669" text-anchor="middle" opacity="1" letter-spacing="0" >是 ↓</text><line x1="720" y1="728" x2="720" y2="760" stroke="#059669" stroke-width="2.4"  marker-end="url(#arrow-green)" opacity="1" /><rect x="540" y="764" width="360" height="84" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.8"  opacity="1" filter="url(#shadow)"  /><text x="720" y="798" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="750" fill="#059669" text-anchor="middle" opacity="1" letter-spacing="0" >startRun()</text><text x="720" y="824" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#047857" text-anchor="middle" opacity="1" letter-spacing="0" >worktree → ACP → 流式落库</text><rect x="58" y="214" width="400" height="630" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"  opacity="1"   /><text x="82" y="258" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="750" fill="#475569" text-anchor="start" opacity="1" letter-spacing="0" >tick() 读什么</text><text x="82" y="300" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="650" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >state.runs</text><text x="82" y="322" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >status === &quot;queued&quot;</text><text x="82" y="348" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="650" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >state.hosts</text><text x="82" y="370" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >online / maxConcurrency</text><text x="82" y="396" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="650" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >state.agents</text><text x="82" y="418" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >max / hostId</text><text x="82" y="444" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="650" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >state.todos</text><text x="82" y="466" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >cwd / status</text><text x="82" y="492" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="650" fill="#2563eb" text-anchor="start" opacity="1" letter-spacing="0" >settings</text><text x="82" y="514" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >maxConcurrentRuns</text><line x1="82" y1="540" x2="434" y2="540" stroke="#e2e8f0"/><text x="82" y="574" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start" opacity="1" letter-spacing="0" >为什么同 cwd 串行？</text><text x="82" y="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >两个 Agent 同时改同一份文件，</text><text x="82" y="622" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >冲突成本远高于排队。</text><text x="82" y="644" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1" letter-spacing="0" >跨 worktree 才并行。</text><rect x="1320" y="214" width="222" height="630" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"  opacity="1"   /><text x="1342" y="258" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="750" fill="#92400e" text-anchor="start" opacity="1" letter-spacing="0" >不做的</text><text x="1342" y="296" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="start" opacity="1" letter-spacing="0" >不写守护进程</text><text x="1342" y="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="start" opacity="1" letter-spacing="0" >不做分布式锁</text><text x="1342" y="364" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="start" opacity="1" letter-spacing="0" >不做任务图引擎</text><text x="1342" y="398" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="start" opacity="1" letter-spacing="0" >不做自动重试风暴</text><line x1="1342" y1="444" x2="1520" y2="444" stroke="#fde68a"/><text x="1342" y="478" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="650" fill="#92400e" text-anchor="start" opacity="1" letter-spacing="0" >先跑通闭环，</text><text x="1342" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="650" fill="#92400e" text-anchor="start" opacity="1" letter-spacing="0" >再谈调度性能。</text><rect x="58" y="900" width="1484" height="46" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"  opacity="1"   /><text x="78" y="929" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="start" opacity="1" letter-spacing="0" >为什么一个 tick 够用：单用户桌面应用，run 数量有限；每次变化重算队列，逻辑简单、可解释、可调试。</text>
