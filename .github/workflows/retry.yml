name: retry

# 只兜一种失败：hosted runner 一直没分配到（job 结论 cancelled、一个 step 都没跑），
# 重跑整次 build，最多 2 次。真正的打包报错不重跑——那要人看日志。
#
# 为什么不写在 build.yml 里：那一步连 job 都没起来，job 内的 step 根本没机会执行。
# 为什么不兜 tag：发布要人盯着，机器没拿到就手动 `gh run rerun --failed`。

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    steps:
      # 用 gh + jq，不引第三方 action：这个仓里别的 workflow 都只用到 actions/*，
      # 这一条又极少触发，少一个依赖少一处会烂的版本号。
      - name: Rerun only when a runner was never acquired
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100")
          succeeded=$(jq '[.jobs[] | select(.conclusion == "success")] | length' <<<"$jobs")
          # 零 step + cancelled = 机器没拿到。整次 run 被并发取消时所有 job 都 cancelled、且没有成功 job，上一行挡掉。
          starved=$(jq -r '[.jobs[] | select(.conclusion == "cancelled" and ((.steps // []) | length) == 0) | .name] | join("、")' <<<"$jobs")
          if [ "$succeeded" -eq 0 ] || [ -z "$starved" ]; then
            echo "不重跑：有成功 job=$succeeded，未启动 job=${starved:-无}"
            exit 0
          fi
          echo "重跑 $RUN_ID（第 $((ATTEMPT + 1)) 次）：$starved 没拿到 runner"
          # 权限不够 / 状态不允许时只记一笔，别让这个兜底 act 自己变红
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun" >/dev/null \
            || echo "::warning title=重跑没成功::权限不足或这次 run 不允许重跑，去 Actions 里手动 rerun"
