name: Bug report
description: Report a reproducible problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, do **not** open a public issue — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Cockpit Harness version
      description: The version shown in Settings → About (e.g. 0.2.0-alpha.1)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Linux x86_64
        - Linux arm64
        - Other
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: How did you install?
      options:
        - GitHub Release binary
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove API keys, tokens, private paths, and personal data before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
        - label: I am using the latest alpha
        - label: This is not a security vulnerability
