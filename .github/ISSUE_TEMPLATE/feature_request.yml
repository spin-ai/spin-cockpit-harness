name: Feature request
description: Suggest an idea or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do? What is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent / execution
        - Chat
        - TODO / kanban
        - Terminal
        - Preview / UI context
        - Files / explorer
        - Projects / hosts
        - Stats / settings
        - Packaging / platform
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues/discussions
        - label: I understand this project is in alpha and scope may change
